<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f14">
<title>Хто нафідив?</title>
<meta name="description" content="Dota 2: встав ID матчу — сайт розбере гру кожного гравця і покаже, хто злив.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one column of "evidence" — search, dossier under crime-scene tape, aspect cards, episodes, graph, line-ups */
:root{
  --ink:#0c0f14; --panel:#141820; --panel2:#1a1f29; --line:#262c37; --text:#e8ebf0; --muted:#8a93a3; --soft:#cfd4dd;
  --tape:#f5c443; --tape-ink:#17130a;
  --rad:#5bc98d; --dire:#ef5d55;
  --t0:#5bc98d; --t1:#b9cf5c; --t2:#f2a23a; --t3:#f0474a;
  --f-display:"Unbounded","Arial Black",sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 520px at 50% -180px,#1c2230 0%,var(--ink) 70%) no-repeat,var(--ink);color:var(--text);font:400 15px/1.5 var(--f-body);min-height:100vh;-webkit-tap-highlight-color:transparent}
main{max-width:1100px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:clip}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
img{max-width:100%}
.c0{color:var(--t0)}.c1{color:var(--t1)}.c2{color:var(--t2)}.c3{color:var(--t3)}

/* шапка */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.eyebrow{font:700 11px/1.3 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lang{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:none;border-radius:999px;padding:6px 12px;font:700 12px var(--f-mono);letter-spacing:.08em;color:var(--muted);min-height:32px}
.lang button:hover{color:var(--text)}
.lang button.on{background:var(--tape);color:var(--tape-ink)}
h1{font:900 clamp(44px,10vw,112px)/.88 var(--f-display);letter-spacing:-.03em;margin:6px 0 18px;text-transform:uppercase}
h1 .q{color:var(--tape)}
.lead{max-width:62ch;color:var(--muted);margin:0 0 26px;font-size:16px}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search input{flex:1 1 280px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);font:500 18px var(--f-mono);padding:15px 16px;letter-spacing:.04em}
.search input::placeholder{color:#5c6474;letter-spacing:0;font-family:var(--f-body);font-size:16px}
.search input:focus{border-color:var(--tape);outline:none}
.btn-main{background:var(--tape);color:var(--tape-ink);border:0;border-radius:10px;font:800 14px var(--f-display);letter-spacing:.06em;padding:0 24px;min-height:54px;text-transform:uppercase}
.btn-main:hover{filter:brightness(1.08)}
.btn-main[disabled]{opacity:.6;cursor:progress}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.chips .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;color:var(--text);min-height:32px}
.chip img{width:34px;height:20px;object-fit:cover;border-radius:999px}
.chip.plain{padding:5px 12px}
.chip:hover{border-color:#3a4252}
.status{margin-top:16px;min-height:22px;font-size:14px;color:var(--muted)}
.status.err{color:var(--dire)}
.status small{display:block;color:var(--muted);font-size:12px;margin-top:6px;max-width:70ch}
.status a{color:var(--tape)}
.status .fb-links{margin-top:8px}
.status .stz-row input{flex:1 1 220px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 12px;font:500 14px var(--f-mono)}
.status .stz-row button{background:var(--tape);color:var(--tape-ink);border:0;border-radius:8px;padding:9px 14px;font:700 13px var(--f-body);min-height:38px}
.status.load::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--tape);margin-right:9px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* стрічка */
.tape{margin:44px -40px 0;background:var(--tape);color:var(--tape-ink);transform:rotate(-1.4deg);overflow:hidden;white-space:nowrap;border-block:2px solid var(--tape-ink);box-shadow:0 8px 24px rgba(0,0,0,.35);position:relative;z-index:2}
.tape div{display:inline-block;font:800 13px/1 var(--f-display);letter-spacing:.14em;padding:10px 0;animation:tape 40s linear infinite}
@keyframes tape{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tape div,.status.load::before{animation:none}}

/* досьє */
.dossier{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:-10px;padding:34px 28px 28px;position:relative;scroll-margin-top:12px}
.dossier-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:30px}
.mug{position:relative}
.mug-photo{border-radius:8px 8px 0 0;overflow:hidden;background:repeating-linear-gradient(180deg,transparent 0 17px,rgba(255,255,255,.07) 17px 18px),var(--panel2);aspect-ratio:16/10;max-width:100%}
.mug-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.75) contrast(1.05)}
.mug-plate{background:#0a0c10;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:9px 12px;display:flex;justify-content:space-between;gap:8px;font:700 12px var(--f-mono);color:#c7ccd6;letter-spacing:.06em}
.stamp{position:absolute;right:-8px;top:14px;transform:rotate(9deg);border:3px solid currentColor;border-radius:6px;padding:6px 12px;font:900 18px/1 var(--f-display);letter-spacing:.08em;color:var(--t3);background:rgba(12,15,20,.6);text-transform:uppercase}
.stamp.ok{color:var(--t0)}.stamp.mid{color:var(--t2)}
.who-line{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:16px 0 4px;color:var(--muted);font-size:13px}
.rank{display:inline-flex;align-items:center;gap:5px}
.rank img{width:22px;height:22px}
.dname{font:800 26px/1.15 var(--f-display);margin:2px 0 0;overflow-wrap:anywhere}
.dname a{color:inherit;text-decoration:none}
.dname a:hover{text-decoration:underline}
.verdict-h{font:800 clamp(22px,3.4vw,32px)/1.12 var(--f-display);margin:8px 0 6px;text-wrap:balance}
.verdict-sub{color:var(--muted);margin:0 0 18px;max-width:62ch}
.fi-big{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.fi-num{font:900 64px/0.9 var(--f-display);letter-spacing:-.03em}
.fi-num small{font:700 16px var(--f-mono);color:var(--muted);letter-spacing:0;margin-left:4px}
.fi-meta{display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px;padding-bottom:4px}
.fi-tag{font:800 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.fi-scale{display:flex;justify-content:space-between;font:500 10px var(--f-mono);color:#5d6676;letter-spacing:.06em;text-transform:uppercase}
.meter{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);background:currentColor;border-radius:99px}
.kstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.kstats div{background:var(--panel2);padding:10px 12px;min-width:0}
.kstats small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kstats b{font:700 18px var(--f-mono)}
.sub-h{font:700 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.facts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.facts li{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start}
.facts li::before{content:"•";font:700 12px/20px var(--f-mono);color:var(--muted);text-align:center;background:var(--ink);border-radius:5px}
.facts li.bad::before{content:"✕";color:var(--t3);background:rgba(240,71,74,.13)}
.facts li.good::before{content:"✓";color:var(--t0);background:rgba(91,201,141,.13)}
.facts.sm{font-size:13.5px;line-height:1.45;gap:7px}
.back{margin-top:18px;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--muted);min-height:38px}
.back:hover{color:var(--text);border-color:#3a4252}

/* частка провини */
.blame{margin-top:26px;border-top:1px dashed var(--line);padding-top:20px}
.blame-h{font-size:13px;color:var(--muted);margin-bottom:10px}
.blame-bar{display:flex;height:42px;border-radius:8px;overflow:hidden;gap:2px}
.blame-bar button{border:0;padding:0 8px;display:flex;align-items:center;gap:6px;min-width:56px;background:var(--panel2);font:700 13px var(--f-mono);overflow:hidden;position:relative}
.blame-bar button img{width:40px;height:24px;object-fit:cover;border-radius:4px;flex:none}
.blame-bar button span{white-space:nowrap}
.blame-bar button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:currentColor}
.blame-bar button.sel{background:#262d3a}

/* аспекти */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin:32px 0 14px}
.sec-h h3{font:800 18px var(--f-display);margin:0;text-wrap:balance}
.sec-h small{color:var(--muted);font-size:13px}
.aspects{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.aspects .asp:nth-child(7){grid-column:1/-1}
.asp{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.asp summary{list-style:none;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.asp summary::-webkit-details-marker{display:none}
.asp .more{display:none;font:600 12px var(--f-body);color:var(--muted);text-align:center}
.asp[open] .more::after{content:" ▴"}
.asp:not([open]) .more::after{content:" ▾"}
.asp .facts{margin-top:12px}
.asp.na{color:var(--muted)}
.asp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.asp-top h4{margin:0;font:800 14px/1.3 var(--f-display);color:var(--text)}
.asp-top small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.asp-score{text-align:right;flex:none}
.asp-score b{display:block;font:800 26px/1 var(--f-mono)}
.grade{font:700 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;display:inline-block;margin-top:5px;white-space:nowrap}
.g0{background:rgba(91,201,141,.14);color:var(--t0)}.g1{background:rgba(185,207,92,.12);color:var(--t1)}.g2{background:rgba(242,162,58,.14);color:var(--t2)}.g3{background:rgba(240,71,74,.14);color:var(--t3)}
.scale{position:relative;height:6px;background:var(--ink);border-radius:9px}
.scale i{position:absolute;left:0;top:0;bottom:0;width:var(--w);border-radius:9px;background:currentColor}
.scale::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--muted);opacity:.7}
.asp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.asp-stats div{min-width:0}
.asp-stats small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asp-stats b{font:700 14px var(--f-mono);white-space:nowrap;color:var(--text)}

.two{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.bench{display:grid;gap:10px;width:100%;max-width:760px}
.bench-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 110px;gap:12px;align-items:center;font-size:13px}
.bench-row .l{color:var(--soft)}
.bench-row .l span{color:var(--muted)}
.bench-row .bar{height:8px;background:var(--ink);border-radius:9px;position:relative}
.bench-row .bar i{position:absolute;left:0;top:0;bottom:0;width:var(--w);border-radius:9px;background:currentColor}
.bench-row .bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--muted);opacity:.7}
.bench-row .v{text-align:right;font:500 12px var(--f-mono);color:var(--muted)}
.bench-row .v b{color:var(--text)}
.note{font-size:12px;color:var(--muted);margin-top:12px;max-width:76ch}
.tbl-wrap{overflow-x:auto}
.dtable{width:100%;border-collapse:collapse;font-size:13px;min-width:430px}
.dtable th{font:600 10px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.dtable td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.dtable td.mono,.dtable td.k{white-space:nowrap}
.dtable img{width:34px;height:20px;object-fit:cover;border-radius:3px;vertical-align:middle;margin-right:6px}
.flag{display:inline-block;font:700 10px var(--f-mono);letter-spacing:.05em;padding:2px 6px;border-radius:4px;margin:1px 3px 1px 0;text-transform:uppercase;white-space:nowrap}
.flag.bad{background:rgba(240,71,74,.14);color:var(--t3)}
.flag.ok{background:rgba(91,201,141,.14);color:var(--t0)}
.flag.info{background:var(--ink);color:var(--muted)}

/* блоки */
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-top:18px}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-bottom:14px}
.box-h h2{font:800 17px var(--f-display);margin:0;letter-spacing:.01em}
.box-h small{color:var(--muted);font-size:13px}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.side{display:flex;flex-direction:column;gap:2px;min-width:0}
.side.r{align-items:flex-start}.side.d{align-items:flex-end;text-align:right}
.side b{font:900 46px/1 var(--f-display)}
.side span{font:700 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;overflow-wrap:anywhere}
.side.r span{color:var(--rad)}.side.d span{color:var(--dire)}
.side em{font-style:normal;font-size:12px;color:var(--muted)}
.mid-info{text-align:center;display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:13px}
.mid-info b{color:var(--text);font:700 22px var(--f-mono)}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.links a{color:var(--muted);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.links a:hover{color:var(--text);border-color:#3a4252}
.notice{margin-top:18px;border:1px solid #4a3d1c;background:#1d1910;border-radius:12px;padding:14px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;color:#e9dcb8}
.notice p{margin:0;max-width:66ch}
.notice button{background:var(--tape);color:var(--tape-ink);border:0;border-radius:8px;padding:10px 16px;font:700 13px var(--f-body);min-height:40px}
.notice button[disabled]{opacity:.6;cursor:progress}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);min-height:34px}
.seg button:hover{color:var(--text)}
.seg button.on{color:var(--tape-ink);background:var(--tape);border-color:var(--tape);font-weight:700}

/* епізоди */
.eps{display:grid;gap:8px}
.ep{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;background:var(--panel2);border:1px solid transparent;border-radius:10px;padding:12px 14px;text-align:left;width:100%}
button.ep:hover{border-color:#343c4b}
.ep-t{font:700 15px var(--f-mono)}
.ep-t small{display:block;font:500 10px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.ep-head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:5px}
.ep-head img{width:34px;height:20px;object-fit:cover;border-radius:3px}
.ep-head b{font-size:13px;overflow-wrap:anywhere}
.ep p{margin:0;font-size:14px;color:var(--soft)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}

/* графік */
.graph svg{display:block;width:100%;height:auto}
.g-axis{stroke:var(--line)}
.g-zero{stroke:#3c4453;stroke-dasharray:4 4}
.g-txt{fill:#6c7586;font:500 11px var(--f-mono)}
.g-line{fill:none;stroke:var(--text);stroke-width:2;stroke-linejoin:round}
.g-rad{fill:var(--rad);opacity:.22}.g-dire{fill:var(--dire);opacity:.22}
.g-death{fill:var(--t3);stroke:var(--panel);stroke-width:2}
.g-death-l{stroke:var(--t3);stroke-width:1;opacity:.45}
.legend{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* склади */
.team + .team{margin-top:18px}
.team-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font:700 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:6px}
.pill.r{background:rgba(91,201,141,.14);color:var(--rad)}
.pill.d{background:rgba(239,93,85,.14);color:var(--dire)}
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:72px minmax(0,1.5fr) 92px 64px 72px minmax(0,1.45fr) 124px;align-items:center;gap:12px;background:var(--panel2);border:1px solid transparent;border-radius:10px;padding:8px 12px 8px 8px;text-align:left;width:100%}
.row:hover{border-color:#343c4b}
.row.sel{border-color:var(--tape)}
.row .hero{width:72px;height:40px;object-fit:cover;border-radius:6px;display:block;background:var(--panel)}
.row .nm{min-width:0}
.row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.row .nm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font:700 14px var(--f-mono);white-space:nowrap}
.row .st small{display:block;font:500 10px var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.row .st em{font-style:normal;color:var(--t3)}
.items{display:flex;gap:3px;flex-wrap:wrap;min-width:0}
.items img{width:31px;height:23px;border-radius:3px;object-fit:cover;background:var(--panel)}
.items img.nt{border-radius:50%;width:23px}
.fi{display:grid;gap:5px}
.fi b{font:800 15px var(--f-mono);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.fi b small{font:600 10px var(--f-body);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.fi .meter{height:6px}
.badge{font:700 10px var(--f-mono);letter-spacing:.1em;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.badge.mvp{background:rgba(245,196,67,.16);color:var(--tape)}
.badge.sm{background:rgba(240,71,74,.18);color:var(--t3)}
.badge.sm2{background:rgba(242,162,58,.16);color:var(--t2)}
.badge.smh{background:var(--ink);color:var(--muted)}
.badge.sml{color:var(--muted);letter-spacing:.2em}
.svs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-top:6px}

<body>

<script>
const API='https://api.opendota.com/api', STEAM='https://cdn.cloudflare.steamstatic.com';
const EXAMPLE='9040745440';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- мова ---------- */
let LANG=(()=>{const s=store.get('nf_lang');if(['uk','en','ru'].includes(s))return s;const n=(navigator.language||'').toLowerCase();return n.startsWith('ru')?'ru':n.startsWith('en')?'en':'uk'})();
const LOC={uk:'uk-UA',en:'en-US',ru:'ru-RU'};
const L=(uk,en,ru)=>LANG==='en'?en:LANG==='ru'?ru:uk;
function plural(n,forms){const f=String(forms||'').split('|');if(LANG==='en')return Math.abs(n)===1?f[0]:f[1];const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return f[2];if(b===1)return f[0];if(b>=2&&b<=4)return f[1];return f[2]}
const P=(n,uk,en,ru)=>plural(n,L(uk,en,ru));

const STATIC={
  title:['Хто нафідив?','Who fed?','Кто нафидил?'],
  eyebrow:['Dota 2 · розслідування поразки','Dota 2 · loss investigation','Dota 2 · расследование поражения'],
  h1:['Хто<br>нафідив<span class="q">?</span>','Who<br>fed<span class="q">?</span>','Кто<br>нафидил<span class="q">?</span>'],
  lead:['Встав ID матчу або посилання з Dotabuff, OpenDota чи STRATZ. Сайт розбере гру кожного гравця: лінію, смерті, фарм, бійки, будівлі, вижен і рішення. Потім порівняє з тисячами інших гравців на тому ж герої і назве, хто злив.',
        'Paste a match ID or a link from Dotabuff, OpenDota or STRATZ. The site breaks down every player: lane, deaths, farm, fights, buildings, vision and decisions. Then it compares them with thousands of players on the same hero and names who threw the game.',
        'Вставь ID матча или ссылку с Dotabuff, OpenDota или STRATZ. Сайт разберёт игру каждого игрока: линию, смерти, фарм, драки, строения, вижн и решения. Потом сравнит с тысячами других игроков на том же герое и назовёт, кто слил.'],
  go:['Знайти фідера','Find the feeder','Найти фидера'],
  ph:['ID матчу, напр. 9040745440','Match ID, e.g. 9040745440','ID матча, напр. 9040745440'],
  howT:['Як працює руїнометр','How the ruin meter works','Как работает руинометр'],
  how:[
`<li>Кожного гравця оцінюємо за 7 аспектами. Кожен аспект — бал від 0 до 100, де <b>50 — норма</b>, менше — гірше, більше — краще.</li>
<li><b>Лінія.</b> Золото, досвід і добивання на 10:00 проти суперника по лінії, смерті та вбивства до 10:00.</li>
<li><b>Смерті.</b> Скільки помирав порівняно з іншими на цьому герої. Скільки золота віддав ворогам. Скільки смертей було «за просто так»: ні вбивства у відповідь за 30 с, ні вежі, ні власного вбивства перед смертю. Що впало, поки лежав.</li>
<li><b>Фарм.</b> GPM, XPM і добивання проти інших гравців на цьому герої. Частка статків команди проти норми позиції. Коли зібрав перший великий предмет.</li>
<li><b>Бійки.</b> Участь у вбивствах, шкода по героях, присутність у командних бійках, смерті в бійках без шкоди.</li>
<li><b>Будівлі й Рошан.</b> Шкода по будівлях проти інших на герої, знесені вежі, вбиті Рошани.</li>
<li><b>Вижен і допомога.</b> Варди за 10 хвилин проти норми позиції, девард, стаки, лікування.</li>
<li><b>Рішення.</b> Байбеки в таверну, дисконекти, кількість TP, невитрачене золото в програній грі, лів.</li>
<li>Вага аспектів залежить від позиції: у керрі найважливіший фарм, у сапортів — вижен і бійки. Позицію бере OpenDota, а якщо її немає — визначаємо за лінією та статками.</li>
<li><b>Руїнометр = 100 − зважений бал.</b> До 38 — тащив, 38–51 — норм, 52–61 — під питанням, від 62 — слив. Хто покинув гру, одразу отримує 100.</li>
<li>Порівняння з іншими гравцями на герої — це перцентилі OpenDota. Без розпарсеного запису матчу лінія, деталі смертей, вижен і рішення недоступні.</li>
<li>Це оцінка за статистикою, а не вирок: смерть «за просто так» могла бути жертвою заради команди.</li>`,
`<li>Every player is rated on 7 aspects. Each aspect is a score from 0 to 100 where <b>50 is normal</b>, lower is worse, higher is better.</li>
<li><b>Lane.</b> Gold, XP and last hits at 10:00 against the lane opponent, plus deaths and kills before 10:00.</li>
<li><b>Deaths.</b> How often the player died compared with others on the same hero, how much gold they fed, how many deaths were "for free" (no trade within 30 s, no tower, no own kill right before) and what fell while they were dead.</li>
<li><b>Farm.</b> GPM, XPM and last hits against other players on the hero, share of team net worth against the position norm, timing of the first big item.</li>

async function getJson(url,opt,generic){
  let r;
  try{r=await fetch(url,opt||undefined)}catch(e){throw new Error(L('Не вдалося зв’язатися з OpenDota. Перевір інтернет і спробуй ще раз.','Couldn’t reach OpenDota. Check your connection and try again.','Не удалось связаться с OpenDota. Проверь интернет и попробуй ещё раз.'))}
  if(r.status===404&&generic)throw new Error(L('OpenDota не має цих даних.','OpenDota has no data for this.','У OpenDota нет этих данных.'));
  if(r.status===404)throw nf404(L('Такого матчу OpenDota не знає. Перевір ID: це число на 10 цифр із Dotabuff, OpenDota або з історії матчів у грі.','OpenDota doesn’t know this match. Check the ID: it’s a 10-digit number from Dotabuff, OpenDota or the in-game match history.','Такого матча OpenDota не знает. Проверь ID: это число из 10 цифр с Dotabuff, OpenDota или из истории матчей в игре.'));
  if(r.status===429)throw rl429(L('OpenDota тимчасово обмежив кількість запитів. Зачекай хвилину й натисни ще раз.','OpenDota is limiting requests right now. Wait a minute and try again.','OpenDota временно ограничил число запросов. Подожди минуту и нажми ещё раз.'));
  if(!r.ok)throw new Error(L(`OpenDota відповів помилкою ${r.status}. Спробуй трохи пізніше.`,`OpenDota returned error ${r.status}. Try again a bit later.`,`OpenDota ответил ошибкой ${r.status}. Попробуй чуть позже.`));
  return r.json();
}

function assignPositions(t){
  const est=t.map(p=>p.position_est);
  if(est.every(x=>x>=1&&x<=5)&&new Set(est).size===t.length){t.forEach(p=>p.pos=p.position_est);return}
  const nw=p=>p.net_worth||p.total_gold||0;
  const sorted=[...t].sort((a,b)=>nw(b)-nw(a));
  let left=[1,2,3,4,5];const set=(p,x)=>{p.pos=x;left=left.filter(y=>y!==x)};
  t.forEach(p=>p.pos=0);
  const mid=sorted.find(p=>p.lane_role===2);if(mid)set(mid,2);
  const safe=sorted.filter(p=>p.lane_role===1&&!p.pos);if(safe[0])set(safe[0],1);if(safe[1])set(safe[1],5);
  const off=sorted.filter(p=>p.lane_role===3&&!p.pos);if(off[0])set(off[0],3);if(off[1])set(off[1],4);
  for(const p of sorted)if(!p.pos)set(p,left.shift()||5);
}

function analyze(m){
  const dur=Math.max(60,m.duration||60),parsed=m.version!=null;
  const P=m.players.map((p,i)=>({...p,i,rad:p.isRadiant!=null?p.isRadiant:p.player_slot<128}));
  const sides={r:P.filter(p=>p.rad),d:P.filter(p=>!p.rad)};
  const c={m,P,sides,dur,parsed};
  assignPositions(sides.r);assignPositions(sides.d);
  c.tf=(m.teamfights||[]).map(f=>[f.start,f.end]);
  c.deathsOf={r:[],d:[]};
  for(const p of P)for(const d of(p.deaths_log||[]))c.deathsOf[p.rad?'r':'d'].push(d.time);
  c.buildings=(m.objectives||[]).filter(o=>o.type==='building_kill'&&o.key).map(o=>({t:o.time,side:/goodguys/.test(o.key)?'r':'d',name:bName(o.key),big:/rax|fort|tower3|tower4/.test(o.key),rax:/rax/.test(o.key)})).filter(b=>b.name);
  for(const p of P){
    p.side=p.rad?'r':'d';p.team=sides[p.side];p.enemy=sides[p.rad?'d':'r'];
    p.won=p.rad===!!m.radiant_win;
    p.opp=p.enemy.find(e=>e.pos===OPP[p.pos])||null;
  }
  for(const p of P){p.dl=deathList(p,c);p.fed=p.dl&&p.dl.some(d=>d.fed!=null)?p.dl.reduce((a,d)=>a+(d.fed||0),0):null}
  c.chat=chatList(c);
  for(const p of P)p.X=extras(p,c);
  for(const p of P){p.A=aspects(p,c);finalize(p)}
  const losers=m.radiant_win?sides.d:sides.r,winners=m.radiant_win?sides.r:sides.d;
  c.culprit=[...losers].sort((a,b)=>b.ruin-a.ruin)[0];
  c.mvp=[...winners].sort((a,b)=>a.ruin-b.ruin)[0];
  c.episodes=episodes(c);
  return c;
}

function deathList(p,c){
  const en=p.rad?'d':'r',my=p.side;
  let raw=Array.isArray(p.deaths_log)&&p.deaths_log.length?p.deaths_log:null;
  if(!raw&&c.parsed&&p.deaths){
    raw=[];const key=hero(p).key;
    for(const e of p.enemy)for(const k of(e.kills_log||[]))if(k.key===key)raw.push({time:k.time,key:hero(e).key});
    if(!raw.length)raw=null;
  }
  if(!raw)return null;
  return raw.slice().sort((a,b)=>a.time-b.time).map(d=>{
    const t=d.time,dead=d.time_dead||0;
    const trade=c.deathsOf[en].some(x=>Math.abs(x-t)<=30);
    const bld=c.buildings.some(b=>b.side===en&&Math.abs(b.t-t)<=40);
    const recentKill=(p.kills_log||[]).some(k=>k.time<=t&&t-k.time<=30);
    const fight=c.tf.some(([s,e])=>t>=s-3&&t<=e+3);
    const lostB=dead?c.buildings.filter(b=>b.side===my&&b.t>t&&b.t<=t+dead):[];
    const bb=(p.buyback_log||[]).some(b=>t-b.time>=0&&t-b.time<=60);
    return{t,killer:HERO_BY_KEY[d.key]||null,fed:d.gold_fed!=null?d.gold_fed:null,lost:d.gold_lost||0,dead,trade,bld,fight,clean:!trade&&!bld&&!recentKill,lostB,bb};
  });
}

const GOLDN=k=>({creep:L('Крипи на лініях','Lane creeps','Крипы на линиях'),neutral:L('Ліс','Jungle','Лес'),hero:L('Вбивства героїв','Hero kills','Убийства героев'),building:L('Будівлі','Buildings','Строения'),roshan:L('Рошан','Roshan','Рошан'),rune:L('Руни','Runes','Руны'),other:L('Пасивне та інше','Passive & other','Пассивное и другое')})[k];

function chatList(c){
  const bySlot={};c.P.forEach(p=>bySlot[p.player_slot]=p);
  return (c.m.chat||[]).filter(e=>e.type==='chat'||e.type==='chatwheel').map(e=>{
    const p=bySlot[e.player_slot]||(e.slot!=null?c.P[e.slot]:null),wheel=e.type==='chatwheel',text=String(e.key??'');
    return{t:e.time,p,wheel,text,tox:!wheel&&TOX.test(text),gg:!wheel&&!!p&&!p.won&&GG.test(text)&&e.time<Math.min(1500,c.dur-180)};
  }).filter(e=>e.p);
}
function fightRows(p,c){
  const tf=c.m.teamfights;if(!Array.isArray(tf)||!tf.length)return null;
  const bkb=(p.purchase_log||[]).find(e=>e.key==='black_king_bar');
  return tf.map((f,idx)=>{
    const x=f.players&&f.players[p.i];if(!x)return null;
    const kills=Object.values(x.killed||{}).reduce((a,b)=>a+b,0),abil=Object.values(x.ability_uses||{}).reduce((a,b)=>a+b,0);
    if(!(x.damage>0||x.healing>0||x.deaths>0||kills>0||abil>0))return null;
    let myD=0,enD=0;f.players.forEach((y,j)=>{const q=c.P[j];if(!q||!y)return;if(q.rad===p.rad)myD+=y.deaths||0;else enD+=y.deaths||0});
    const iu=x.item_uses||{};
    return{start:f.start,end:f.end,myD,enD,won:enD>myD,dmg:x.damage||0,heal:x.healing||0,kills,died:x.deaths>0,gold:x.gold_delta||0,abil,items:Object.keys(iu),bkbIdle:!!bkb&&bkb.time<f.start&&!iu.black_king_bar&&x.deaths>0};
  }).filter(Boolean);
}
function wardList(p,c){
  if(!Array.isArray(p.obs_log)&&!Array.isArray(p.sen_log))return [];
  const left={};for(const w of(p.obs_left_log||[]).concat(p.sen_left_log||[]))if(w.ehandle!=null)left[w.ehandle]=w;
  const mk=(arr,type,life)=>(arr||[]).map(w=>{const l=w.ehandle!=null?left[w.ehandle]:null,d=(l?l.time:c.dur)-w.time;
    return{type,x:w.x,y:w.y,t:w.time,life:Math.max(0,Math.min(d,life)),killed:!!(l&&l.attackername&&d<life-5),by:l&&l.attackername?HERO_BY_KEY[l.attackername]||null:null}});
  return mk(p.obs_log,'obs',360).concat(mk(p.sen_log,'sen',420));
}
function extras(p,c){
  const X={items:[],fights:null,wards:[],tox:0,toxT:null,gg:null,msgs:0};
  if(Array.isArray(p.purchase_log)){
    const uses=p.item_uses||{},seen=new Set();
    for(const e of p.purchase_log){
      if(!KEY_ITEMS.includes(e.key)||seen.has(e.key)||!ITEMK[e.key])continue;seen.add(e.key);
      const own=Math.max(0,(c.dur-Math.max(0,e.time))/60),u=uses[e.key]||0,n=ITEMK[e.key].n,bt=mmss(e.time);let bad=false,txt='';
      if(u===0&&own>=6&&!NO_FLAG.includes(e.key)){bad=true;txt=L(`Купив ${n} на ${bt} і жодного разу не використав.`,`Bought ${n} at ${bt} and never used it.`,`Купил ${n} на ${bt} и ни разу не использовал.`)}
      else if(e.key==='hand_of_midas'&&own>=8&&u<own/1.5*.6){bad=true;txt=L(`${n}: лише ${u} використань за ${Math.round(own)} хв — Мідас треба тиснути кожні ~1,5 хв.`,`${n}: only ${u} uses in ${Math.round(own)} min — Midas should be used every ~1.5 min.`,`${n}: всего ${u} использований за ${Math.round(own)} мин — Мидас надо жать каждые ~1,5 мин.`)}
      X.items.push({key:e.key,n,t:e.time,u,own,bad,badText:txt});
    }
  }
  if(p.gold_reasons){
    const g={creep:0,neutral:0,hero:0,building:0,roshan:0,rune:0,other:0};let lost=0;
    for(const k in p.gold_reasons){const v=+p.gold_reasons[k]||0;if(k==='1'){lost+=Math.abs(v);continue}if(k==='2'||k==='6'||v<=0)continue;g[GR[k]||'other']+=v}
    X.gold={g,total:Object.values(g).reduce((a,b)=>a+b,0),lost};
  }
  if(p.damage)X.dmgTo=p.enemy.map(e=>({e,v:p.damage[hero(e).key]||0})).sort((a,b)=>b.v-a.v);
  if(p.damage_taken)X.dmgFrom=p.enemy.map(e=>({e,v:p.damage_taken[hero(e).key]||0})).sort((a,b)=>b.v-a.v);
  X.fights=fightRows(p,c);
  X.wards=wardList(p,c);
  const my=c.chat.filter(e=>e.p===p),tx=my.filter(e=>e.tox);
  X.msgs=my.length;X.tox=tx.length;X.toxT=tx[0]?tx[0].t:null;X.gg=my.find(e=>e.gg)||null;
  return X;
}

function aspects(p,c){return{lane:aLane(p,c),deaths:aDeaths(p,c),farm:aFarm(p,c),fights:aFights(p,c),obj:aObj(p,c),vision:aVision(p,c),dec:aDec(p,c)}}
const DEATHS=n=>P(n,'смерть|смерті|смертей','death|deaths','смерть|смерти|смертей');
const TIMES=n=>P(n,'раз|рази|разів','time|times','раз|раза|раз');

function aLane(p,c){
  const o=p.opp,i=10;
  if(!c.parsed||!o||c.dur<660||!(p.gold_t&&p.gold_t.length>i&&o.gold_t&&o.gold_t.length>i&&p.xp_t&&o.xp_t))return null;
  const nwD=p.gold_t[i]-o.gold_t[i],xpD=p.xp_t[i]-o.xp_t[i];
  const lh=(p.lh_t||[])[i]||0,dn=(p.dn_t||[])[i]||0,olh=(o.lh_t||[])[i]||0,odn=(o.dn_t||[])[i]||0;
  const ld=(p.dl||[]).filter(d=>d.t<600),lk=(p.kills_log||[]).filter(k=>k.time<600).length;
  const core=p.pos<=3;
  const s=cl(50+cl(nwD/(core?40:65),-30,30)+cl(xpD/70,-15,15)-ld.length*7+lk*3);
  const F=[];
  F.push({c:nwD>=500?'good':nwD<=-500?'bad':'info',t:L(`На 10:00 проти ${H(o)} (${POS(o.pos)}): золото ${sgn(nwD)}, досвід ${sgn(xpD)}.`,`At 10:00 vs ${H(o)} (${POS(o.pos)}): gold ${sgn(nwD)}, XP ${sgn(xpD)}.`,`На 10:00 против ${H(o)} (${POS(o.pos)}): золото ${sgn(nwD)}, опыт ${sgn(xpD)}.`)});
  if(core)F.push({c:lh-olh>=8?'good':lh-olh<=-8?'bad':'info',t:L(`Добивання/денаї ${lh}/${dn} проти ${olh}/${odn} у суперника.`,`Last hits/denies ${lh}/${dn} vs ${olh}/${odn} for the opponent.`,`Добивания/денаи ${lh}/${dn} против ${olh}/${odn} у соперника.`)});
  else if(dn>=5)F.push({c:'good',t:L(`${dn} денаїв до 10:00 — заважав фармити супернику.`,`${dn} denies before 10:00 — kept the opponent from farming.`,`${dn} денаев до 10:00 — мешал сопернику фармить.`)});
  if(ld.length)F.push({c:ld.length>=2?'bad':'info',t:L(`${ld.length} ${DEATHS(ld.length)} на лінії (${times(ld)}).`,`${ld.length} ${DEATHS(ld.length)} on lane (${times(ld)}).`,`${ld.length} ${DEATHS(ld.length)} на линии (${times(ld)}).`)});
  if(lk>=2)F.push({c:'good',t:`${lk} ${P(lk,'вбивство|вбивства|вбивств','kill|kills','убийство|убийства|убийств')} ${L('до 10:00','before 10:00','до 10:00')}.`});
  if(p.lane_efficiency_pct!=null&&core)F.push({c:p.lane_efficiency_pct<40?'bad':'info',t:L(`Ефективність лінії ${p.lane_efficiency_pct}%: стільки золота з лінії зібрано від можливого.`,`Lane efficiency ${p.lane_efficiency_pct}%: share of available lane gold collected.`,`Эффективность линии ${p.lane_efficiency_pct}%: столько золота с линии собрано от возможного.`)});
  return{s,F,stats:[[L('Золото @10','Gold @10','Золото @10'),sgn(nwD)],[L('Досвід @10','XP @10','Опыт @10'),sgn(xpD)],[L('Добив./ден.','LH/DN','Добив./ден.'),`${lh}/${dn}`]],nwD,xpD,lh,olh,ld};
}

function aDeaths(p,c){
  const d=p.deaths||0,per10=d/(c.dur/600),dp=bp(p,'deaths_per_min'),dl=p.dl;
  let s=dp!=null?dp*100:100-clamp01((per10-.8)/2.7)*100;
  const teamFed=p.team.reduce((a,x)=>a+(x.fed||0),0)||1,fs=p.fed!=null?p.fed/teamFed:null;
  const clean=dl?dl.filter(x=>x.clean):[];
  if(fs!=null)s-=Math.max(0,fs-.25)*80;
  s-=clean.length*2.5;
  s=cl(s);
  const F=[];
  let tail;
  if(dp!=null){const hi=dp>=.5,x=Math.round((hi?dp:1-dp)*100);tail=L(` — ${hi?'менше':'більше'}, ніж у ${x}% гравців на ${H(p)}`,` — ${hi?'fewer':'more'} than ${x}% of ${H(p)} players`,` — ${hi?'меньше':'больше'}, чем у ${x}% игроков на ${H(p)}`)}
  else tail=d?L(` — кожні ${mmss(c.dur/d)}`,` — one every ${mmss(c.dur/d)}`,` — каждые ${mmss(c.dur/d)}`):'';
  F.push({c:dp!=null?(dp<.35?'bad':dp>.65?'good':'info'):(per10>2?'bad':'info'),t:`${d} ${DEATHS(d)}${tail}.`});
  if(p.fed!=null&&d)F.push({c:fs>=.3?'bad':'info',t:L(`Віддав ворогам ${num(p.fed)} золота своїми смертями — ${pct(fs)} від того, що нафідила вся команда.`,`Gave the enemy ${num(p.fed)} gold by dying — ${pct(fs)} of everything the team fed.`,`Отдал врагам ${num(p.fed)} золота своими смертями — ${pct(fs)} от того, что нафидила вся команда.`)});
  if(clean.length)F.push({c:clean.length>=3?'bad':'info',t:L(`${clean.length} з ${d} ${P(d,'смерті|смертей|смертей')} «за просто так»: ні вбивства у відповідь, ні вежі, ні вбивства перед смертю (${times(clean)}).`,`${clean.length} of ${d} deaths were “for free”: no trade, no tower, no kill right before (${times(clean)}).`,`${clean.length} из ${d} ${P(d,'','','смерти|смертей|смертей')} «просто так»: ни убийства в ответ, ни башни, ни убийства перед смертью (${times(clean)}).`)});
  if(dl&&d){const out=dl.filter(x=>!x.fight).length;if(out>=3)F.push({c:out>=5?'bad':'info',t:L(`${out} ${DEATHS(out)} поза командними бійками — ловили самого.`,`${out} ${DEATHS(out)} outside teamfights — caught alone.`,`${out} ${DEATHS(out)} вне командных драк — ловили одного.`)})}
  if(p.life_state_dead)F.push({c:p.life_state_dead/c.dur>=.15?'bad':'info',t:L(`На респавні ${mmss(p.life_state_dead)} — ${pct(p.life_state_dead/c.dur)} гри.`,`Spent ${mmss(p.life_state_dead)} dead — ${pct(p.life_state_dead/c.dur)} of the game.`,`На респавне ${mmss(p.life_state_dead)} — ${pct(p.life_state_dead/c.dur)} игры.`)});
  const lostB=dl?dl.flatMap(x=>x.lostB):[];
  if(lostB.length)F.push({c:lostB.some(b=>b.big)?'bad':'info',t:L('Поки лежав, команда втратила: ','While dead, the team lost: ','Пока лежал, команда потеряла: ')+lostB.map(b=>b.name).join(', ')+'.'});
  const k=topKiller(p);if(k&&k.c>=3)F.push({c:'info',t:L(`Найчастіше вбивав ${k.n} — ${k.c} ${TIMES(k.c)}.`,`Killed most often by ${k.n} — ${k.c} ${TIMES(k.c)}.`,`Чаще всего убивал ${k.n} — ${k.c} ${TIMES(k.c)}.`)});
  return{s,F,stats:[[L('Смерті','Deaths','Смерти'),d],[L('Нафідив','Gold fed','Нафидил'),p.fed!=null?kfmt(p.fed):'—'],[L('На респавні','Time dead','На респавне'),p.life_state_dead!=null?mmss(p.life_state_dead):'—']],clean,lostB};
}
function topKiller(p){
  const kb=Object.entries(p.killed_by||{}).filter(([k])=>k.startsWith('npc_dota_hero_')).sort((a,b)=>b[1]-a[1])[0];
  if(!kb)return null;const h=HERO_BY_KEY[kb[0]];return h?{n:h.n,c:kb[1]}:null;
}

function aFarm(p,c){
  const g=bp(p,'gold_per_min'),l=bp(p,'last_hits_per_min'),x=bp(p,'xp_per_min');

  if(p.pos<=3||(l!=null&&l>.7))F.push({c:l!=null?(l<.3?'bad':l>.7?'good':'info'):'info',t:`${lh} ${P(lh,'добивання|добивання|добивань','last hit|last hits','добивание|добивания|добиваний')} (${dec(lh/min)} ${L('за хв','per min','в мин')})${l!=null?' — '+vsHero(l,p):''}.`});
  F.push({c:x!=null&&x<.3?'bad':x!=null&&x>.7?'good':'info',t:`XPM ${p.xp_per_min||0}, ${L('рівень','level','уровень')} ${p.level||'—'}${x!=null?' — '+vsHero(x,p):''}.`});
  F.push({c:p.pos<=3&&share<exp-.05?'bad':share>exp+.05?'good':'info',t:L(`${pct(share)} статків команди (${norm(p.pos,pct(exp))}).`,`${pct(share)} of team net worth (${norm(p.pos,pct(exp))}).`,`${pct(share)} богатства команды (${norm(p.pos,pct(exp))}).`)});
  const G=p.X&&p.X.gold;
  if(G&&G.total>0){
    const ns=G.g.neutral/G.total,hs=G.g.hero/G.total,kpF=((p.kills||0)+(p.assists||0))/(tsum(p.team,'kills')||1);

    else F.push({c:'info',t:L(`Золото: ${pct(G.g.creep/G.total)} — крипи на лініях, ${pct(ns)} — ліс, ${pct(hs)} — вбивства.`,`Gold: ${pct(G.g.creep/G.total)} lane creeps, ${pct(ns)} jungle, ${pct(hs)} kills.`,`Золото: ${pct(G.g.creep/G.total)} — крипы на линиях, ${pct(ns)} — лес, ${pct(hs)} — убийства.`)});
  }
  let big=null;
  if(Array.isArray(p.purchase_log))big=p.purchase_log.find(e=>e.time>0&&ITEMK[e.key]&&ITEMK[e.key].cost>=2000&&ITEMK[e.key].asm&&!/recipe|ward|tome|smoke|dust|gem|cheese|aegis/.test(e.key));
  if(big){const late=BIG_LATE[p.pos]&&big.time>BIG_LATE[p.pos]*60,it=ITEMK[big.key].n;
    F.push({c:late?'bad':p.pos<=3&&big.time<BIG_LATE[p.pos]*60*.7?'good':'info',t:L(`Перший великий предмет — ${it} на ${mmss(big.time)}${late?` (пізно для ${POS(p.pos)})`:''}.`,`First big item — ${it} at ${mmss(big.time)}${late?` (late for a ${POS(p.pos)})`:''}.`,`Первый крупный предмет — ${it} на ${mmss(big.time)}${late?` (поздно для ${POS(p.pos)})`:''}.`)});
    if(late)s=cl(s-6);
  }else if(c.parsed&&p.pos<=2&&c.dur>1500){F.push({c:'bad',t:L('За всю гру не зібрав жодного предмета дорожче 2000 золота.','Never finished an item worth 2000+ gold.','За всю игру не собрал ни одного предмета дороже 2000 золота.')});s=cl(s-10)}
  return{s,F,stats:[['GPM',p.gold_per_min||0],['XPM',p.xp_per_min||0],[L('Статки','Net worth','Нетворс'),kfmt(nw)]]};

function aFights(p,c){
  const tk=tsum(p.team,'kills')||1,kp=((p.kills||0)+(p.assists||0))/tk,ekp=KP_NORM[p.pos];
  const dmg=bp(p,'hero_damage_per_min'),kpm=bp(p,'kills_per_min'),apm=bp(p,'assists_per_min');
  const ds=(p.hero_damage||0)/(tsum(p.team,'hero_damage')||1),tfp=p.teamfight_participation;
  let s=cl(avg([dmg!=null?dmg*100:null,cl(50+(kp-ekp)*160),tfp!=null?cl(tfp*90+10):null,avg([kpm,apm])!=null?avg([kpm,apm])*100:null])??50);
  const F=[];
  F.push({c:kp<ekp-.12?'bad':kp>ekp+.1?'good':'info',t:L(`Участь у вбивствах ${pct(kp)} (${norm(p.pos,pct(ekp))}).`,`Kill participation ${pct(kp)} (${norm(p.pos,pct(ekp))}).`,`Участие в убийствах ${pct(kp)} (${norm(p.pos,pct(ekp))}).`)});
  F.push({c:dmg!=null?(dmg<.3?'bad':dmg>.7?'good':'info'):'info',t:L(`Шкода по героях ${num(p.hero_damage)} — ${pct(ds)} команди`,`Hero damage ${num(p.hero_damage)} — ${pct(ds)} of the team`,`Урон по героям ${num(p.hero_damage)} — ${pct(ds)} команды`)+(dmg!=null?'; '+vsHero(dmg,p,1):'')+'.'});
  if(tfp!=null)F.push({c:tfp<.4?'bad':tfp>.7?'good':'info',t:L(`Був у ${pct(tfp)} командних бійок.`,`Took part in ${pct(tfp)} of teamfights.`,`Был в ${pct(tfp)} командных драк.`)});
  if(Array.isArray(c.m.teamfights)){
    let weak=0;for(const f of c.m.teamfights){const x=f.players&&f.players[p.i];if(x&&x.deaths>0&&(x.damage||0)<300)weak++}
    if(weak>=2)F.push({c:'bad',t:L(`У ${weak} ${P(weak,'бійці|бійках|бійках')} помер, майже не завдавши шкоди.`,`Died in ${weak} fights while dealing almost no damage.`,`В ${weak} ${P(weak,'','','драке|драках|драках')} умер, почти не нанеся урона.`)});
  }
  if(p.stuns>=10)F.push({c:'info',t:L(`Контроль: ${Math.round(p.stuns)} с станів по ворогах.`,`Control: ${Math.round(p.stuns)} s of stuns on enemies.`,`Контроль: ${Math.round(p.stuns)} с станов по врагам.`)});
  const mk=Math.max(0,...Object.keys(p.multi_kills||{}).map(Number));
  if(mk>=3){const nm=L({3:'тріпл-кіл',4:'ультра-кіл',5:'рампага'},{3:'Triple Kill',4:'Ultra Kill',5:'Rampage'},{3:'трипл-килл',4:'ультра-килл',5:'рампага'})[Math.min(5,mk)];
    F.push({c:'good',t:L(`Найкращий мультикіл: ${nm}.`,`Best multikill: ${nm}.`,`Лучший мультикилл: ${nm}.`)})}
  const idle=(p.X&&p.X.fights||[]).filter(f=>f.bkbIdle);
  if(idle.length){const tt=idle.map(f=>mmss(f.start)).join(', ');s=cl(s-5*idle.length);
    F.push({c:'bad',t:L(`У ${idle.length} ${P(idle.length,'бійці|бійках|бійках')} помер з BKB, не натиснувши його (${tt}).`,`Died in ${idle.length} ${P(idle.length,'','fight|fights')} with BKB and never pressed it (${tt}).`,`В ${idle.length} ${P(idle.length,'','','драке|драках|драках')} умер с BKB, не нажав его (${tt}).`)})}
  const dt=p.X&&p.X.dmgTo;
  if(dt&&dt.some(x=>x.v)){const tot=dt.reduce((a,x)=>a+x.v,0),cs=dt.filter(x=>x.e.pos<=3).reduce((a,x)=>a+x.v,0)/tot,top=dt[0];
    F.push({c:p.pos<=3&&cs<.4?'bad':'info',t:L(`Найбільше шкоди — по ${H(top.e)} (${pct(top.v/tot)}); по ворожих корах — ${pct(cs)}.`,`Most damage went to ${H(top.e)} (${pct(top.v/tot)}); ${pct(cs)} to enemy cores.`,`Больше всего урона — по ${H(top.e)} (${pct(top.v/tot)}); по вражеским корам — ${pct(cs)}.`)})}
  return{s,F,stats:[[L('Участь','KP','Участие'),pct(kp)],[L('Шкода','Damage','Урон'),kfmt(p.hero_damage)],[L('Бійки','Fights','Драки'),tfp!=null?pct(tfp):'—']]};
}

function aObj(p,c){
  const tp=bp(p,'tower_damage'),td=p.tower_damage||0,share=td/(tsum(p.team,'tower_damage')||1);
  let s=tp!=null?tp*100:cl(50+(share-.2)*150);
  s=cl(s+(p.roshans_killed||0)*4);
  const F=[{c:tp!=null?(tp<.25?'bad':tp>.7?'good':'info'):'info',t:L(`${num(td)} шкоди по будівлях — ${pct(share)} команди`,`${num(td)} building damage — ${pct(share)} of the team`,`${num(td)} урона по строениям — ${pct(share)} команды`)+(tp!=null?'; '+vsHero(tp,p,1):'')+'.'}];
  if(p.towers_killed)F.push({c:'good',t:L(`Добив ${p.towers_killed} ${P(p.towers_killed,'вежу|вежі|веж')}.`,`Took down ${p.towers_killed} ${P(p.towers_killed,'','tower|towers')}.`,`Добил ${p.towers_killed} ${P(p.towers_killed,'','','башню|башни|башен')}.`)});
  if(p.roshans_killed)F.push({c:'good',t:L(`Вбив Рошана ${p.roshans_killed} ${TIMES(p.roshans_killed)}.`,`Killed Roshan ${p.roshans_killed} ${TIMES(p.roshans_killed)}.`,`Убил Рошана ${p.roshans_killed} ${TIMES(p.roshans_killed)}.`)});
  if(p.pos<=3&&!p.won&&share<.1&&c.dur>1500)F.push({c:'bad',t:L('Майже не тиснув будівлі — кор без пушу дає ворогу час.','Barely hit buildings — a core who doesn’t push gives the enemy time.','Почти не давил строения — кор без пуша даёт врагу время.')});
  return{s,F,stats:[[L('По будівлях','Buildings','По строениям'),kfmt(td)],[L('Вежі','Towers','Башни'),p.towers_killed??'—'],[L('Рошан','Roshan','Рошан'),p.roshans_killed??'—']]};
}

function aVision(p,c){
  if(!c.parsed)return null;
  const obs=p.obs_placed||0,sen=p.sen_placed||0,dw=(p.observer_kills||0)+(p.sentry_kills||0),st=p.camps_stacked||0,heal=p.hero_healing||0,hp=bp(p,'hero_healing_per_min');
  const per10=(obs+sen)/(c.dur/600),exp=WARD_NORM[p.pos];
  let s=50+(per10-exp)*(p.pos>=4?14:6)+dw*2+st*1.2+(hp!=null&&heal>500?(hp-.5)*20:0);
  if(p.pos>=4&&obs+sen<4)s-=15;
  s=cl(s);
  const F=[];
  F.push({c:p.pos>=4?(per10<exp*.6?'bad':per10>exp*1.2?'good':'info'):'info',t:L(`Поставив ${obs} обс. і ${sen} сентрі — ${dec(per10)} за 10 хв (${norm(p.pos,dec(exp))}).`,`Placed ${obs} observers and ${sen} sentries — ${dec(per10)} per 10 min (${norm(p.pos,dec(exp))}).`,`Поставил ${obs} обс. и ${sen} сентри — ${dec(per10)} за 10 мин (${norm(p.pos,dec(exp))}).`)});
  if(dw)F.push({c:dw>=3?'good':'info',t:L(`Зніс ${dw} ${P(dw,'ворожий вард|ворожі варди|ворожих вардів')}.`,`Destroyed ${dw} ${P(dw,'','enemy ward|enemy wards')}.`,`Снёс ${dw} ${P(dw,'','','вражеский вард|вражеских варда|вражеских вардов')}.`)});
  else if(p.pos>=4&&c.dur>1500)F.push({c:'bad',t:L('Жодного девард за гру.','Not a single deward all game.','Ни одного деварда за игру.')});
  if(st)F.push({c:st>=4?'good':'info',t:L(`Стакнув ${st} ${P(st,'табір|табори|таборів')}.`,`Stacked ${st} ${P(st,'','camp|camps')}.`,`Застакал ${st} ${P(st,'','','лагерь|лагеря|лагерей')}.`)});
  if(heal>=1000)F.push({c:'good',t:L(`Вилікував ${num(heal)} HP.`,`Healed ${num(heal)} HP.`,`Вылечил ${num(heal)} HP.`)});
  const sm=(p.item_uses||{}).smoke_of_deceit||0;if(sm)F.push({c:'info',t:L(`Використав смоук ${sm} ${TIMES(sm)}.`,`Used Smoke ${sm} ${TIMES(sm)}.`,`Использовал смок ${sm} ${TIMES(sm)}.`)});
  const ow=(p.X&&p.X.wards||[]).filter(w=>w.type==='obs');
  if(ow.length>=3){const k=ow.filter(w=>w.killed).length,kr=k/ow.length,al=ow.reduce((a,w)=>a+w.life,0)/ow.length;
    if(kr>=.5){s=cl(s-8);F.push({c:'bad',t:L(`Вороги знесли ${k} з ${ow.length} обсерверів (${pct(kr)}), середнє життя ${mmss(al)} — варди в передбачуваних місцях.`,`The enemy destroyed ${k} of ${ow.length} observers (${pct(kr)}), average life ${mmss(al)} — predictable ward spots.`,`Враги снесли ${k} из ${ow.length} обсерверов (${pct(kr)}), средняя жизнь ${mmss(al)} — варды в предсказуемых местах.`)})}
    else F.push({c:al>=240?'good':'info',t:L(`Обсервери жили в середньому ${mmss(al)} із 6:00, знесли ${k} з ${ow.length}.`,`Observers lived ${mmss(al)} on average out of 6:00; ${k} of ${ow.length} were destroyed.`,`Обсерверы жили в среднем ${mmss(al)} из 6:00, снесли ${k} из ${ow.length}.`)});
  }
  return{s,F,stats:[[L('Варди','Wards','Варды'),obs+sen],[L('Девард','Dewards','Деварды'),dw],[L('Стаки','Stacks','Стаки'),st]]};
}

function aDec(p,c){
  if((p.leaver_status||0)>=2)return{s:0,F:[{c:'bad',t:L('Покинув гру до кінця — команда грала вчотирьох.','Abandoned the game — the team played 4v5.','Покинул игру — команда играла вчетвером.')}],stats:[[L('Лів','Abandon','Лив'),L('так','yes','да')],['TP','—'],[L('Байбеки','Buybacks','Байбеки'),'—']]};
  if(!c.parsed)return null;
  let s=60;const F=[];
  const bbT=(p.dl||[]).filter(d=>d.bb);
  bbT.forEach(d=>{s-=12;F.push({c:'bad',t:L(`Байбек у таверну: викупився і знову помер на ${mmss(d.t)}.`,`Wasted buyback: bought back and died again at ${mmss(d.t)}.`,`Байбек в таверну: выкупился и снова умер на ${mmss(d.t)}.`)})});
  const dc=(p.connection_log||[]).filter(e=>/discon/.test(e.event||'')).length;
  if(dc){s-=Math.min(30,dc*10);F.push({c:'bad',t:L(`Відключався від гри ${dc} ${TIMES(dc)}.`,`Disconnected ${dc} ${TIMES(dc)}.`,`Отключался от игры ${dc} ${TIMES(dc)}.`)})}
  const tp=(p.item_uses||{}).tpscroll||0,tp10=tp/(c.dur/600);
  if(c.dur>1200&&tp10<.7){s-=8;F.push({c:'bad',t:L(`Лише ${tp} TP за гру — повільно приходив на бійки та захист веж.`,`Only ${tp} TPs all game — slow to join fights and defend towers.`,`Всего ${tp} ТП за игру — медленно приходил на драки и защиту башен.`)})}
  else if(tp10>=1.5){s+=6;F.push({c:'good',t:L(`${tp} телепортів — активно реагував на карту.`,`${tp} teleports — reacted to the map actively.`,`${tp} телепортов — активно реагировал на карту.`)})}
  if(!p.won&&(p.gold||0)>=2500){s-=6;F.push({c:'bad',t:L(`Закінчив програну гру з ${num(p.gold)} невитраченого золота.`,`Ended a lost game with ${num(p.gold)} unspent gold.`,`Закончил проигранную игру с ${num(p.gold)} непотраченного золота.`)})}
  const bb=(p.buyback_log||[]).length;if(bb&&!bbT.length)F.push({c:'info',t:L(`Байбеків: ${bb}, усі без повторної смерті.`,`Buybacks: ${bb}, none wasted.`,`Байбеков: ${bb}, все без повторной смерти.`)});
  const X=p.X||{};
  (X.items||[]).filter(i=>i.bad).slice(0,3).forEach(i=>{s-=6;F.push({c:'bad',t:i.badText})});
  if(X.tox>=2){s-=Math.min(12,X.tox*3);F.push({c:'bad',t:`${X.tox} ${P(X.tox,'токсичне повідомлення|токсичні повідомлення|токсичних повідомлень','toxic chat message|toxic chat messages','токсичное сообщение|токсичных сообщения|токсичных сообщений')} ${L('у чаті','','в чате')}.`.replace(' .','.')})}
  if(X.gg){s-=6;F.push({c:'bad',t:L(`Написав «${X.gg.text}» на ${mmss(X.gg.t)} — здався до кінця гри.`,`Typed “${X.gg.text}” at ${mmss(X.gg.t)} — gave up before the end.`,`Написал «${X.gg.text}» на ${mmss(X.gg.t)} — сдался до конца игры.`)})}
  if(!F.length)F.push({c:'info',t:L('Помітних помилок у рішеннях не знайдено.','No notable decision mistakes found.','Заметных ошибок в решениях не найдено.')});
  return{s:cl(s),F,stats:[['TP',tp],[L('Байбеки','Buybacks','Байбеки'),bb],[L('Дисконекти','Disconnects','Дисконнекты'),dc]]};
}

function finalize(p){
  const w=W[p.pos]||W[3];let tw=0,acc=0;
  for(const k of ASP_KEYS){const a=p.A[k];if(a&&w[k]){acc+=a.s*w[k];tw+=w[k]}}
  p.R=tw?acc/tw:50;
  p.leaver=(p.leaver_status||0)>=2;
  p.ruin=p.leaver?100:Math.round(cl(100-p.R));
  p.worst=ASPECTS().filter(([k])=>p.A[k]&&w[k]>=.1&&p.A[k].s<50).map(([k,n])=>({k,n,s:p.A[k].s,w:w[k]})).sort((a,b)=>(a.s-50)*a.w-(b.s-50)*b.w)[0]||null;
}

function killStreakTime(p,n){
  const t=(p.kills_log||[]).map(k=>k.time).sort((a,b)=>a-b);
  for(let i=0;i+n-1<t.length;i++){let ok=true;for(let j=i+1;j<i+n;j++)if(t[j]-t[j-1]>18){ok=false;break}if(ok)return t[i]}
  return null;
}

function episodes(c){
  const E=[],add=o=>E.push(o);
  for(const p of c.P){
    const A=p.A.lane;
    if(A&&p.opp){
      if(A.nwD<=-1200||A.xpD<=-1500)add({t:600,tone:'bad',tag:L('Програв лінію','Lost lane','Проиграл линию'),p,txt:L(`${H(p)} — ${sgn(A.nwD)} золота і ${sgn(A.xpD)} досвіду проти ${H(p.opp)} на 10:00 (добивання ${A.lh} проти ${A.olh}).`,`${H(p)} — ${sgn(A.nwD)} gold and ${sgn(A.xpD)} XP vs ${H(p.opp)} at 10:00 (last hits ${A.lh} vs ${A.olh}).`,`${H(p)} — ${sgn(A.nwD)} золота и ${sgn(A.xpD)} опыта против ${H(p.opp)} на 10:00 (добивания ${A.lh} против ${A.olh}).`)});
      else if(A.nwD>=1200||A.xpD>=1500)add({t:600,tone:'good',tag:L('Виграв лінію','Won lane','Выиграл линию'),p,txt:L(`${H(p)} — ${sgn(A.nwD)} золота і ${sgn(A.xpD)} досвіду над ${H(p.opp)} на 10:00.`,`${H(p)} — ${sgn(A.nwD)} gold and ${sgn(A.xpD)} XP over ${H(p.opp)} at 10:00.`,`${H(p)} — ${sgn(A.nwD)} золота и ${sgn(A.xpD)} опыта над ${H(p.opp)} на 10:00.`)});
    }
    const dl=p.dl||[];
    const lc=dl.filter(d=>d.t<600&&d.clean);
    if(lc.length>=2)add({t:lc[0].t,tone:'bad',tag:L('Роздача на лінії','Feeding on lane','Раздача на линии'),p,txt:L(`${H(p)} — ${lc.length} ${DEATHS(lc.length)} до 10:00 без вбивства у відповідь (${times(lc)}).`,`${H(p)} — ${lc.length} ${DEATHS(lc.length)} before 10:00 with no trade (${times(lc)}).`,`${H(p)} — ${lc.length} ${DEATHS(lc.length)} до 10:00 без убийства в ответ (${times(lc)}).`)});
    const cln=dl.filter(d=>d.clean);
    if(cln.length>=4){const f=cln.reduce((a,d)=>a+(d.fed||0),0);
      add({t:cln[0].t,tone:'bad',tag:L('Чистий фід','Pure feed','Чистый фид'),p,txt:L(`${H(p)} — ${cln.length} з ${dl.length} смертей без жодної користі для команди (${times(cln)})${f?`; ворогам віддано ${num(f)} золота`:''}.`,`${H(p)} — ${cln.length} of ${dl.length} deaths with zero value for the team (${times(cln)})${f?`; ${num(f)} gold handed to the enemy`:''}.`,`${H(p)} — ${cln.length} из ${dl.length} смертей без всякой пользы для команды (${times(cln)})${f?`; врагам отдано ${num(f)} золота`:''}.`)})}
    for(const d of dl){
      const names=d.lostB.map(b=>b.name).join(', ');
      if(d.bb)add({t:d.t,tone:'bad',tag:L('Байбек у таверну','Wasted buyback','Байбек в таверну'),p,txt:L(`${H(p)} викупився і знову помер на ${mmss(d.t)}${names?`; поки лежав, впало: ${names}`:''}.`,`${H(p)} bought back and died again at ${mmss(d.t)}${names?`; while dead the team lost: ${names}`:''}.`,`${H(p)} выкупился и снова умер на ${mmss(d.t)}${names?`; пока лежал, упало: ${names}`:''}.`)});
      else if(d.lostB.some(b=>b.big))add({t:d.t,tone:'bad',tag:L('Поки лежав','While dead','Пока лежал'),p,txt:L(`${H(p)} помер на ${mmss(d.t)}${d.killer?` від ${d.killer.n}`:''}, і за ${d.dead} с на респавні команда втратила: ${names}.`,`${H(p)} died at ${mmss(d.t)}${d.killer?` to ${d.killer.n}`:''}, and during ${d.dead} s of respawn the team lost: ${names}.`,`${H(p)} умер на ${mmss(d.t)}${d.killer?` от ${d.killer.n}`:''}, и за ${d.dead} с на респавне команда потеряла: ${names}.`)});
    }
    (p.connection_log||[]).filter(e=>/discon/.test(e.event||'')).forEach(e=>add({t:e.time,tone:'bad',tag:L('Дисконект','Disconnect','Дисконнект'),p,txt:L(`${H(p)} (${pname(p)}) відключився від гри.`,`${H(p)} (${pname(p)}) disconnected from the game.`,`${H(p)} (${pname(p)}) отключился от игры.`)}));
    for(const f of(p.X.fights||[]).filter(f=>f.bkbIdle))add({t:f.start,tone:'bad',tag:L('BKB у кишені','BKB unused','BKB в кармане'),p,txt:L(`${H(p)} помер у бійці на ${mmss(f.start)}, маючи BKB, і не натиснув його.`,`${H(p)} died in the fight at ${mmss(f.start)} with BKB and never pressed it.`,`${H(p)} умер в драке на ${mmss(f.start)} с BKB и не нажал его.`)});
    if(p.X.gg)add({t:p.X.gg.t,tone:'bad',tag:L('Здався','Gave up','Сдался'),p,txt:L(`${pname(p)} (${H(p)}) написав «${p.X.gg.text}» на ${mmss(p.X.gg.t)}, хоча гра тривала до ${mmss(c.dur)}.`,`${pname(p)} (${H(p)}) typed “${p.X.gg.text}” at ${mmss(p.X.gg.t)} while the game went on until ${mmss(c.dur)}.`,`${pname(p)} (${H(p)}) написал «${p.X.gg.text}» на ${mmss(p.X.gg.t)}, хотя игра шла до ${mmss(c.dur)}.`)});
    if(p.X.tox>=3)add({t:p.X.toxT,tone:'bad',tag:L('Токсик','Toxic','Токсик'),p,txt:L(`${pname(p)} (${H(p)}) — ${p.X.tox} токсичних повідомлень у чаті.`,`${pname(p)} (${H(p)}) — ${p.X.tox} toxic chat messages.`,`${pname(p)} (${H(p)}) — ${p.X.tox} токсичных сообщений в чате.`)});
    for(const it of p.X.items.filter(i=>i.bad&&i.key==='black_king_bar'))add({t:it.t,tone:'bad',tag:L('BKB не вмикав','BKB never used','BKB не включал'),p,txt:it.badText});
    if(p.leaver)add({t:null,tone:'bad',tag:L('Лівер','Abandon','Ливер'),p,txt:L(`${H(p)} (${pname(p)}) покинув гру.`,`${H(p)} (${pname(p)}) abandoned the game.`,`${H(p)} (${pname(p)}) покинул игру.`)});
    for(const n of[5,4]){const t=killStreakTime(p,n);if(t!=null){const nm=n===5?L('рампагу','a Rampage','рампагу'):L('ультра-кіл','an Ultra Kill','ультра-килл');
      add({t,tone:'good',tag:n===5?L('Рампага','Rampage','Рампага'):L('Ультра-кіл','Ultra Kill','Ультра-килл'),p,txt:L(`${H(p)} зробив ${nm} на ${mmss(t)}.`,`${H(p)} got ${nm} at ${mmss(t)}.`,`${H(p)} сделал ${nm} на ${mmss(t)}.`)});break}}
  }
  const sp=c.P.filter(p=>p.fed!=null).sort((a,b)=>b.fed-a.fed)[0];
  if(sp&&sp.fed>=2500)add({t:null,tone:'bad',tag:L('Головний спонсор','Top sponsor','Главный спонсор'),p:sp,txt:L(`${H(sp)} віддав ворогам ${num(sp.fed)} золота смертями — найбільше в матчі.`,`${H(sp)} gave the enemy ${num(sp.fed)} gold by dying — the most in the match.`,`${H(sp)} отдал врагам ${num(sp.fed)} золота смертями — больше всех в матче.`)});
  for(const k of['r','d']){const t=c.sides[k].slice().sort((a,b)=>(b.life_state_dead||0)-(a.life_state_dead||0))[0];
    if(t&&t.life_state_dead>=c.dur*.15)add({t:null,tone:'info',tag:L('Найбільше на респавні','Most time dead','Больше всех на респавне'),p:t,txt:L(`${H(t)} — ${mmss(t.life_state_dead)} мертвим (${pct(t.life_state_dead/c.dur)} гри), більше всіх у ${SIDE(k)}.`,`${H(t)} — ${mmss(t.life_state_dead)} dead (${pct(t.life_state_dead/c.dur)} of the game), the most on ${SIDE(k)}.`,`${H(t)} — ${mmss(t.life_state_dead)} мёртвым (${pct(t.life_state_dead/c.dur)} игры), больше всех в ${SIDE(k)}.`)})}
  const adv=c.m.radiant_gold_adv;
  if(Array.isArray(adv)&&adv.length){const lr=!c.m.radiant_win,lead=adv.map(v=>lr?v:-v),mx=Math.max(...lead);
    if(mx>=5000){const mi=lead.indexOf(mx),sd=lr?'Radiant':'Dire';add({t:mi*60,tone:'bad',tag:L('Кинули перевагу','Threw the lead','Слили преимущество'),p:null,txt:L(`${sd} вели +${num(mx)} золота на ${mi}-й хвилині і все одно програли.`,`${sd} led by +${num(mx)} gold at minute ${mi} and still lost.`,`${sd} вели +${num(mx)} золота на ${mi}-й минуте и всё равно проиграли.`)})}}
  const fb=(c.m.objectives||[]).find(o=>o.type==='CHAT_MESSAGE_FIRSTBLOOD');
  if(fb){const k=c.P.find(p=>p.player_slot===fb.player_slot),v=c.P.find(p=>p.player_slot===fb.victim_player_slot)||c.P[+fb.key];
    if(k&&v)add({t:fb.time,tone:'info',tag:L('Перша кров','First blood','Первая кровь'),p:v,txt:L(`${H(k)} вбив ${H(v)}.`,`${H(k)} killed ${H(v)}.`,`${H(k)} убил ${H(v)}.`)})}
  (c.m.objectives||[]).filter(o=>o.type==='CHAT_MESSAGE_ROSHAN_KILL').forEach(o=>{const sd=o.team===2?'Radiant':'Dire';add({t:o.time,tone:'info',tag:L('Рошан','Roshan','Рошан'),p:null,txt:L(`Рошана вбили ${sd}.`,`${sd} killed Roshan.`,`Рошана убили ${sd}.`)})});
  const fr={};for(const b of c.buildings)if(b.rax){if(fr[b.side])continue;fr[b.side]=1;const sd=SIDE(b.side);
    add({t:b.t,tone:'info',tag:L('Перші казарми','First barracks','Первые казармы'),p:null,txt:L(`${sd} втратили ${b.name}.`,`${sd} lost ${b.name}.`,`${sd} потеряли ${b.name}.`)})}
  return E.sort((a,b)=>(a.t??-1)-(b.t??-1));
}

const MOBILE=()=>matchMedia('(max-width:640px)').matches;
function render(){
  $('result').hidden=false;document.body.classList.add('has-result');

function topFacts(p){
  const w=W[p.pos];
  const asp=ASP_KEYS.map(k=>({a:p.A[k],w:w[k]})).filter(x=>x.a);
  const bad=asp.filter(x=>x.w>=.05).sort((a,b)=>(a.a.s-50)*a.w-(b.a.s-50)*b.w).flatMap(x=>x.a.F.filter(f=>f.c==='bad')).slice(0,4);
  const good=asp.slice().sort((a,b)=>(b.a.s-50)*b.w-(a.a.s-50)*a.w).flatMap(x=>x.a.F.filter(f=>f.c==='good')).slice(0,3);
  return{bad,good};
}

/* предмети й скіли */
let ABIL=null,abilP=null;
function loadAbil(){
  if(ABIL)return Promise.resolve();
  if(abilP)return abilP;
  const c=store.get('nf_abil_v2');if(c&&Date.now()-c.t<7*864e5){ABIL=c.a;return Promise.resolve()}
  abilP=Promise.all([getJson(API+'/constants/ability_ids',null,true),getJson(API+'/constants/abilities',null,true)]).then(([ids,ab])=>{
    const A={};for(const id in ids){const k=ids[id],a=ab[k];if(a)A[id]={n:String(a.dname||k).replace(/\{s:[^}]+\}/g,'X'),img:a.img||'',t:k.startsWith('special_bonus')?1:0}}
    ABIL=A;store.set('nf_abil_v2',{t:Date.now(),a:A});
  }).finally(()=>{abilP=null});
  return abilP;
}

function goldHtml(p){
  if(!S.parsed)return needParse();
  const X=p.X,G=X.gold;let h='';
  h+=`<div class="sec-h"><h3>${L('Звідки золото','Where the gold came from','Откуда золото')}</h3>${G?`<small>${num(G.total)} ${L('зароблено','earned','заработано')}${G.lost?` · ${num(G.lost)} ${L('втрачено на смертях','lost on deaths','потеряно на смертях')}`:''}</small>`:''}</div>`;
  if(G&&G.total){const ks=Object.keys(G.g).filter(k=>G.g[k]>0).sort((a,b)=>G.g[b]-G.g[a]);
    h+=`<div class="stack">${ks.map(k=>`<i style="width:${(G.g[k]/G.total*100).toFixed(2)}%;background:${GOLDC[k]}" title="${esc(GOLDN(k))}"></i>`).join('')}</div><div class="lg">${ks.map(k=>`<span><i style="background:${GOLDC[k]}"></i>${GOLDN(k)}<b>${num(G.g[k])} · ${pct(G.g[k]/G.total)}</b></span>`).join('')}</div>`;
  }else h+=noData();
  const bars=(list,c)=>{const mx=Math.max(1,...list.map(x=>x.v)),tot=list.reduce((a,x)=>a+x.v,0)||1;
    return `<div class="hbars">${list.map(x=>`<div class="hbar ${c}"><span class="who">${heroImg(x.e)?`<img src="${heroImg(x.e)}" alt="">`:''}${esc(H(x.e))}</span><span class="bar"><i style="--w:${(x.v/mx*100).toFixed(1)}%"></i></span><span class="v">${kfmt(x.v)} · ${pct(x.v/tot)}</span></div>`).join('')}</div>`};
  const to=X.dmgTo&&X.dmgTo.some(x=>x.v)?X.dmgTo:null,fr=X.dmgFrom&&X.dmgFrom.some(x=>x.v)?X.dmgFrom:null;
  let note='';if(to){const tot=to.reduce((a,x)=>a+x.v,0),cs=to.filter(x=>x.e.pos<=3).reduce((a,x)=>a+x.v,0)/tot;note=`<div class="note">${L(`${pct(cs)} шкоди — по ворожих корах (поз. 1–3), ${pct(1-cs)} — по сапортах.`,`${pct(cs)} of damage went to enemy cores (pos. 1–3), ${pct(1-cs)} to supports.`,`${pct(cs)} урона — по вражеским корам (поз. 1–3), ${pct(1-cs)} — по саппортам.`)}</div>`}
  h+=`<div class="grid2"><div><div class="sec-h"><h3>${L('По кому бив','Damage dealt to','По кому бил')}</h3></div>${to?bars(to,'c3')+note:noData()}</div><div><div class="sec-h"><h3>${L('Хто бив його','Damage taken from','Кто бил его')}</h3></div>${fr?bars(fr,'c2'):noData()}</div></div>`;
  return h;
}

/* STRATZ: точні позиції по секундах (ключ зберігається лише в цьому браузері) */
const STZ={};
const stzKey=()=>{try{return localStorage.getItem('nf_stratz')||''}catch(e){return ''}};
async function loadStratz(id){
  if(STZ[id])return;STZ[id]={loading:true};
  const q='query($id:Long!){match(id:$id){id parsedDateTime players{playerSlot heroId playbackData{playerUpdatePositionEvents{time x y}}}}}';
  try{
    let r;
    try{r=await fetch('https://api.stratz.com/graphql',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+stzKey()},body:JSON.stringify({query:q,variables:{id:+id}})})}
    catch(e){throw new Error(L('Не вдалося зв’язатися з STRATZ. Перевір інтернет.','Couldn’t reach STRATZ. Check your connection.','Не удалось связаться с STRATZ. Проверь интернет.'))}
    if(r.status===401||r.status===403)throw new Error(L('STRATZ не прийняв ключ. Перевір, що скопіював його повністю.','STRATZ rejected the key. Make sure you copied all of it.','STRATZ не принял ключ. Проверь, что скопировал его полностью.'));
    if(r.status===429)throw new Error(L('Ліміт запитів STRATZ вичерпано. Спробуй пізніше.','STRATZ rate limit reached. Try later.','Лимит запросов STRATZ исчерпан. Попробуй позже.'));
    const j=await r.json();
    if(j.errors&&j.errors.length&&!(j.data&&j.data.match))throw new Error('STRATZ: '+j.errors.map(e=>e.message).join('; '));
    const m=j.data&&j.data.match;
    const players={};let any=false;
    for(const pl of(m&&m.players)||[]){const ev=pl.playbackData&&pl.playbackData.playerUpdatePositionEvents;if(Array.isArray(ev)&&ev.length){any=true;players[pl.playerSlot]=ev.map(e=>[e.time,e.x,e.y]).sort((a,b)=>a[0]-b[0])}}
    STZ[id]=any?{players}:{err:L('STRATZ ще не розібрав запис цього матчу. Відкрий матч на stratz.com — він стане в чергу, — і спробуй за кілька хвилин.','STRATZ hasn’t parsed this replay yet. Open the match on stratz.com to queue it and try again in a few minutes.','STRATZ ещё не разобрал запись этого матча. Открой матч на stratz.com — он встанет в очередь, — и попробуй через несколько минут.'),notParsed:true};
  }catch(e){STZ[id]={err:e.message}}
}
/* перерахунок координат STRATZ у сітку карти: зсув підбирається за позиціями OpenDota перших 10 хвилин */
function stzOffset(p,pts){
  const lp=p.lane_pos||{};let sx=0,sy=0,n=0;for(const x in lp)for(const y in lp[x]){const c=lp[x][y];sx+=x*c;sy+=y*c;n+=c}
  const early=pts.filter(q=>q[0]>=0&&q[0]<=600);
  if(!n||early.length<20)return[0,0];
  const ax=early.reduce((a,q)=>a+q[1],0)/early.length,ay=early.reduce((a,q)=>a+q[2],0)/early.length;
  const dx=sx/n-ax,dy=sy/n-ay;
  return Math.abs(dx)>2||Math.abs(dy)>2?[dx,dy]:[0,0];
}

/* чат і драфт матчу */
let CW=null,cwP=null;
function loadCW(){
  if(CW)return Promise.resolve();if(cwP)return cwP;
  const c=store.get('nf_cw_v1');if(c&&Date.now()-c.t<14*864e5){CW=c.w;return Promise.resolve()}
  cwP=getJson(API+'/constants/chat_wheel',null,true).then(w=>{const o={};for(const k in w)o[k]=w[k].message||w[k].label||'';CW=o;store.set('nf_cw_v1',{t:Date.now(),w:o})}).finally(()=>{cwP=null});
  return cwP;
}
function msgHtml(e){
  const p=e.p,txt=e.wheel?`<em>[${L('чат-колесо','chat wheel','чат-колесо')}]</em> ${esc(CW&&CW[e.text]||'')}`:esc(e.text);
  return `<div class="msg${e.tox?' tox':''}"><span class="t">${mmss(e.t)}</span>${heroImg(p)?`<img src="${heroImg(p)}" alt="${esc(H(p))}">`:'<span></span>'}<span class="tx"><b style="color:${p.rad?'var(--rad)':'var(--dire)'}">${esc(pname(p))}</b>${txt}${e.tox?` <span class="flag bad">${L('токсик','toxic','токсик')}</span>`:''}${e.gg?` <span class="flag bad">${L('здався','gave up','сдался')}</span>`:''}</span></div>`;
}
function renderChat(){
  const box=$('chatBox'),list=S.chat||[];
  if(!S.parsed||!list.length){box.hidden=true;return}
  box.hidden=false;
  if(list.some(e=>e.wheel)&&!CW)loadCW().then(()=>{if(S)renderChat()}).catch(()=>{});
  const tox=list.filter(e=>e.tox).length;
  box.innerHTML=`<div class="box-h"><h2>${L('Чат матчу','Match chat','Чат матча')}</h2><small>${list.length} ${P(list.length,'повідомлення|повідомлення|повідомлень','message|messages','сообщение|сообщения|сообщений')}${tox?` · ${L('токсичних','toxic','токсичных')}: ${tox}`:''}</small></div><div class="chat">${list.map(msgHtml).join('')}</div>`;

let MU=null;const MU_LOAD=new Set();
const muC=()=>MU||(MU=store.get('nf_mu_v1')||{});
const muFresh=id=>{const m=muC()[id];return m&&Date.now()-m.t<5*864e5};
async function loadMatchups(ids){
  const mu=muC(),need=ids.filter(id=>!muFresh(id)&&!MU_LOAD.has(id));
  need.forEach(id=>MU_LOAD.add(id));
  await Promise.all(need.map(async id=>{try{const r=await getJson(API+`/heroes/${id}/matchups`,null,true);const m={};for(const x of r)m[x.hero_id]=[x.games_played,x.wins];mu[id]={t:Date.now(),m}}catch(e){}finally{MU_LOAD.delete(id)}}));
  store.set('nf_mu_v1',mu);
}
function renderDraft(){
  const box=$('draftBox'),m=S.m,ids=S.P.map(p=>p.hero_id).filter(Boolean),mu=muC(),ready=ids.every(muFresh);
  if(!ready&&!ids.some(id=>MU_LOAD.has(id)))loadMatchups(ids).then(()=>{if(S&&S.m===m)renderDraft()});
  const side=k=>{const t=S.sides[k].slice().sort((a,b)=>a.pos-b.pos);let sum=0,cnt=0;
    const rows=t.map(p=>{const mm=mu[p.hero_id]&&mu[p.hero_id].m||{};
      const vs=p.enemy.map(e=>{const r=mm[e.hero_id];return r&&r[0]>=5?{e,wr:r[1]/r[0],g:r[0]}:{e,wr:null,g:r?r[0]:0}});
      const v=vs.filter(x=>x.wr!=null),g=v.reduce((a,x)=>a+x.g,0),a=g?v.reduce((s,x)=>s+x.wr*x.g,0)/g:null;if(a!=null){sum+=a;cnt++}
      return `<div class="dr-row"><img src="${heroImg(p)}" alt=""><div style="min-width:0"><b>${esc(H(p))}</b> <small style="color:var(--muted)">${POSS()} ${p.pos}</small><div class="dr-mu">${vs.map(x=>`<span title="${esc(H(p)+' vs '+H(x.e)+(x.wr!=null?': '+pct(x.wr)+' ('+x.g+')':''))}"><img src="${heroImg(x.e)}" alt="${esc(H(x.e))}"><b class="${x.wr==null?'':x.wr>=.53?'c0':x.wr<=.47?'c3':''}">${x.wr==null?'—':Math.round(x.wr*100)}</b></span>`).join('')}</div></div><b class="mono ${a==null?'':a>=.52?'c0':a<=.48?'c3':''}">${a==null?'—':dec(a*100)+'%'}</b></div>`});
    return{rows,avg:cnt?sum/cnt:null}};

  const bans=t=>{const b=(m.picks_bans||[]).filter(x=>!x.is_pick&&x.team===t);return b.length?`<div class="bans">${L('Бани','Bans','Баны')}: ${b.map(x=>{const hh=HEROES[x.hero_id];return hh?`<img src="${STEAM+hh.img}" alt="${esc(hh.n)}" title="${esc(hh.n)}">`:''}).join('')}</div>`:''};
  const won=k=>((k==='r')===!!m.radiant_win)?` <small style="color:var(--muted)">${L('перемогли','won','победили')}</small>`:'';
  box.innerHTML=`<div class="box-h"><h2>${L('Драфт','Draft','Драфт')}</h2><small>${sum||''}</small></div>${!ready?loadingHtml(L('Рахую матчапи героїв…','Calculating hero matchups…','Считаю матчапы героев…')):''}
  <div class="draft"><div><div class="team-h"><span class="pill r">Radiant</span>${won('r')}</div>${r.rows.join('')}${bans(0)}</div><div><div class="team-h"><span class="pill d">Dire</span>${won('d')}</div>${d.rows.join('')}${bans(1)}</div></div>
  <div class="note">${L('Число біля ворожого героя — як часто цей герой перемагає проти нього за статистикою OpenDota. Праворуч — середнє проти всієї ворожої п’ятірки. Зелене — вигідний матчап, червоне — невигідний.','The number next to each enemy is how often this hero wins against it per OpenDota stats. On the right is the average against the whole enemy five. Green = favourable, red = unfavourable.','Число возле вражеского героя — как часто этот герой побеждает против него по статистике OpenDota. Справа — среднее против всей вражеской пятёрки. Зелёное — выгодный матчап, красное — невыгодный.')}</div>`;

let graphNarrow=null;
function renderGraph(){
  const box=$('graphBox'),mode=S.gm||'gold';
  const adv=mode==='xp'?S.m.radiant_xp_adv:S.m.radiant_gold_adv;
  if(!Array.isArray(S.m.radiant_gold_adv)||S.m.radiant_gold_adv.length<2||!Array.isArray(adv)){box.hidden=true;return}
  box.hidden=false;
  const narrow=(box.clientWidth||innerWidth)<600;graphNarrow=narrow;
  const p=S.P[S.sel],dt=(p.dl||[]).map(d=>d.t);
  const W=narrow?440:820,Hh=narrow?250:240,Lp=narrow?40:48,Rp=narrow?8:14,T=12,B=26,iw=W-Lp-Rp,ih=Hh-T-B;
  const peak=Math.max(1000,...adv.map(Math.abs));
  const step=peak>20000?10000:peak>8000?5000:2000;
  const max=Math.ceil(peak/step)*step,n=adv.length-1;
  const x=i=>Lp+i/n*iw,y=v=>T+ih/2-(v/max)*(ih/2),mid=y(0);
  const pts=adv.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const area=`M${x(0)},${mid} L${pts.join(' L')} L${x(n)},${mid} Z`;
  let grid='';for(let v=-max;v<=max;v+=step){if(v===0)continue;grid+=`<line class="g-axis" x1="${Lp}" x2="${W-Rp}" y1="${y(v)}" y2="${y(v)}" opacity=".5"/><text class="g-txt" x="${Lp-6}" y="${y(v)+4}" text-anchor="end">${v>0?'+':'−'}${Math.abs(v)/1000}k</text>`}
  const tstep=narrow?(n>40?10:n>20?5:2):(n>50?10:n>24?5:n>10?2:1);
  let xt='';for(let i=0;i<=n;i+=tstep)xt+=`<text class="g-txt" x="${x(i)}" y="${Hh-6}" text-anchor="middle">${i}′</text>`;
  const valAt=s=>{const f=cl(s/60,0,n),i0=Math.floor(f),i1=Math.min(n,i0+1);return adv[i0]+(adv[i1]-adv[i0])*(f-i0)};
  const died=L('помер на','died at','умер на');
  const dots=dt.map(s=>{const cx=x(cl(s/60,0,n)),cy=y(valAt(s));return `<line class="g-death-l" x1="${cx}" x2="${cx}" y1="${cy}" y2="${mid}"/><circle class="g-death" cx="${cx}" cy="${cy}" r="${narrow?4:5}"><title>${esc(pname(p))} ${died} ${mmss(s)}</title></circle>`}).join('');
  box.innerHTML=`
  <div class="box-h"><h2>${mode==='xp'?L('Перевага в досвіді','XP advantage','Преимущество в опыте'):L('Перевага в золоті','Gold advantage','Преимущество в золоте')}</h2><div class="seg"><button type="button" data-g="gold" class="${mode==='gold'?'on':''}">${L('Золото','Gold','Золото')}</button>${Array.isArray(S.m.radiant_xp_adv)?`<button type="button" data-g="xp" class="${mode==='xp'?'on':''}">${L('Досвід','XP','Опыт')}</button>`:''}</div></div>
  <div class="graph"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${L('Графік переваги по хвилинах','Advantage by minute','График преимущества по минутам')}">
    <defs><clipPath id="cTop"><rect x="0" y="0" width="${W}" height="${mid}"/></clipPath><clipPath id="cBot"><rect x="0" y="${mid}" width="${W}" height="${Hh-mid}"/></clipPath></defs>
    ${grid}
    <path class="g-rad" d="${area}" clip-path="url(#cTop)"/><path class="g-dire" d="${area}" clip-path="url(#cBot)"/>
    <line class="g-zero" x1="${Lp}" x2="${W-Rp}" y1="${mid}" y2="${mid}"/>
    <polyline class="g-line" points="${pts.join(' ')}"/>
    ${dots}${xt}
  </svg></div>
  <div class="legend"><span><i style="background:var(--rad)"></i>${L('Radiant попереду','Radiant ahead','Radiant впереди')}</span><span><i style="background:var(--dire)"></i>${L('Dire попереду','Dire ahead','Dire впереди')}</span>${dt.length?`<span><i style="background:var(--t3);border-radius:50%"></i>${L('Смерті','Deaths','Смерти')}: ${esc(pname(p))} (${esc(H(p))})</span>`:''}</div>`;
  box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.gm=b.dataset.g;renderGraph()});
}

  let tries=0;clearInterval(pollTimer);
  setStatus(L('OpenDota розбирає запис матчу. Зазвичай це 1–3 хвилини, сторінка оновиться сама.','OpenDota is parsing the replay. Usually 1–3 minutes; the page will update itself.','OpenDota разбирает запись матча. Обычно 1–3 минуты, страница обновится сама.'),'load');
  pollTimer=setInterval(async()=>{
    tries++;
    try{const m=await getJson(API+'/matches/'+id);if(m.version!=null){clearInterval(pollTimer);show(m);setStatus(L('Матч розпарсено — додано лінію, смерті, вижен, епізоди й графік.','Match parsed — lane, deaths, vision, episodes and graph added.','Матч распарсен — добавлены линия, смерти, вижн, эпизоды и график.'));return}}catch(e){}
    if(tries>=20){clearInterval(pollTimer);setStatus(L('OpenDota досі не розпарсив матч. Іноді запис гри вже недоступний (старі матчі). Спробуй пізніше.','OpenDota still hasn’t parsed the match. Sometimes the replay is no longer available (old matches). Try again later.','OpenDota до сих пор не распарсил матч. Иногда запись игры уже недоступна (старые матчи). Попробуй позже.'),'err');if($('parseBtn')){$('parseBtn').disabled=false;$('parseBtn').textContent=L('Спробувати ще раз','Try again','Попробовать ещё раз')}}
  },15000);
}
