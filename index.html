    for(const d of dl){
      const names=d.lostB.map(b=>b.name).join(', ');
      if(d.bb)add({t:d.t,tone:'bad',tag:L('Байбек у таверну','Wasted buyback','Байбек в таверну'),p,txt:L(`${H(p)} викупився і знову помер на ${mmss(d.t)}${names?`; поки лежав, впало: ${names}`:''}.`,`${H(p)} bought back and died again at ${mmss(d.t)}${names?`; while dead the team lost: ${names}`:''}.`,`${H(p)} выкупился и снова умер на ${mmss(d.t)}${names?`; пока лежал, упало: ${names}`:''}.`)});
      else if(d.lostB.some(b=>b.big))add({t:d.t,tone:'bad',tag:L('Поки лежав','While dead','Пока лежал'),p,txt:L(`${H(p)} помер на ${mmss(d.t)}${d.killer?` від ${d.killer.n}`:''}, і за ${d.dead} с на респавні команда втратила: ${names}.`,`${H(p)} died at ${mmss(d.t)}${d.killer?` to ${d.killer.n}`:''}, and during ${d.dead} s of respawn the team lost: ${names}.`,`${H(p)} умер на ${mmss(d.t)}${d.killer?` от ${d.killer.n}`:''}, и за ${d.dead} с на респавне команда потеряла: ${names}.`)});
    }
    (p.connection_log||[]).filter(e=>/discon/.test(e.event||'')).forEach(e=>add({t:e.time,tone:'bad',tag:L('Дисконект','Disconnect','Дисконнект'),p,txt:L(`${H(p)} (${pname(p)}) відключився від гри.`,`${H(p)} (${pname(p)}) disconnected from the game.`,`${H(p)} (${pname(p)}) отключился от игры.`)}));
    for(const f of(p.X.fights||[]).filter(f=>f.bkbIdle))add({t:f.start,tone:'bad',tag:L('BKB у кишені','BKB unused','BKB в кармане'),p,txt:L(`${H(p)} помер у бійці на ${mmss(f.start)}, маючи BKB, і не натиснув його.`,`${H(p)} died in the fight at ${mmss(f.start)} with BKB and never pressed it.`,`${H(p)} умер в драке на ${mmss(f.start)} с BKB и не нажал его.`)});
    if(p.X.gg)add({t:p.X.gg.t,tone:'bad',tag:L('Здався','Gave up','Сдался'),p,txt:L(`${pname(p)} (${H(p)}) написав «${p.X.gg.text}» на ${mmss(p.X.gg.t)}, хоча гра тривала до ${mmss(c.dur)}.`,`${pname(p)} (${H(p)}) typed “${p.X.gg.text}” at ${mmss(p.X.gg.t)} while the game went on until ${mmss(c.dur)}.`,`${pname(p)} (${H(p)}) написал «${p.X.gg.text}» на ${mmss(p.X.gg.t)}, хотя игра шла до ${mmss(c.dur)}.`)});
    if(p.X.tox>=3)add({t:p.X.toxT,tone:'bad',tag:L('Токсик','Toxic','Токсик'),p,txt:L(`${pname(p)} (${H(p)}) — ${p.X.tox} токсичних повідомлень у чаті.`,`${pname(p)} (${H(p)}) — ${p.X.tox} toxic chat messages.`,`${pname(p)} (${H(p)}) — ${p.X.tox} токсичных сообщений в чате.`)});
    for(const it of p.X.items.filter(i=>i.bad&&i.key==='black_king_bar'))add({t:it.t,tone:'bad',tag:L('BKB не вмикав','BKB never used','BKB не включал'),p,txt:it.badText});
    if(p.leaver)add({t:null,tone:'bad',tag:L('Лівер','Abandon','Ливер'),p,txt:L(`${H(p)} (${pname(p)}) покинув гру.`,`${H(p)} (${pname(p)}) abandoned the game.`,`${H(p)} (${pname(p)}) покинул игру.`)});
    for(const n of[5,4]){const t=killStreakTime(p,n);if(t!=null){const nm=n===5?L('рампагу','a Rampage','рампагу'):L('ультра-кіл','an Ultra Kill','ультра-килл');
      add({t,tone:'good',tag:n===5?L('Рампага','Rampage','Рампага'):L('Ультра-кіл','Ultra Kill','Ультра-килл'),p,txt:L(`${H(p)} зробив ${nm} на ${mmss(t)}.`,`${H(p)} got ${nm} at ${mmss(t)}.`,`${H(p)} сделал ${nm} на ${mmss(t)}.`)});break}}
  }
  const sp=c.P.filter(p=>p.fed!=null).sort((a,b)=>b.fed-a.fed)[0];
  if(sp&&sp.fed>=2500)add({t:null,tone:'bad',tag:L('Головний спонсор','Top sponsor','Главный спонсор'),p:sp,txt:L(`${H(sp)} віддав ворогам ${num(sp.fed)} золота смертями — найбільше в матчі.`,`${H(sp)} gave the enemy ${num(sp.fed)} gold by dying — the most in the match.`,`${H(sp)} отдал врагам ${num(sp.fed)} золота смертями — больше всех в матче.`)});
  for(const k of['r','d']){const t=c.sides[k].slice().sort((a,b)=>(b.life_state_dead||0)-(a.life_state_dead||0))[0];
    if(t&&t.life_state_dead>=c.dur*.15)add({t:null,tone:'info',tag:L('Найбільше на респавні','Most time dead','Больше всех на респавне'),p:t,txt:L(`${H(t)} — ${mmss(t.life_state_dead)} мертвим (${pct(t.life_state_dead/c.dur)} гри), більше всіх у ${SIDE(k)}.`,`${H(t)} — ${mmss(t.life_state_dead)} dead (${pct(t.life_state_dead/c.dur)} of the game), the most on ${SIDE(k)}.`,`${H(t)} — ${mmss(t.life_state_dead)} мёртвым (${pct(t.life_state_dead/c.dur)} игры), больше всех в ${SIDE(k)}.`)})}
  const adv=c.m.radiant_gold_adv;
  if(Array.isArray(adv)&&adv.length){const lr=!c.m.radiant_win,lead=adv.map(v=>lr?v:-v),mx=Math.max(...lead);
    if(mx>=5000){const mi=lead.indexOf(mx),sd=lr?'Radiant':'Dire';add({t:mi*60,tone:'bad',tag:L('Кинули перевагу','Threw the lead','Слили преимущество'),p:null,txt:L(`${sd} вели +${num(mx)} золота на ${mi}-й хвилині і все одно програли.`,`${sd} led by +${num(mx)} gold at minute ${mi} and still lost.`,`${sd} вели +${num(mx)} золота на ${mi}-й минуте и всё равно проиграли.`)})}}
  const fb=(c.m.objectives||[]).find(o=>o.type==='CHAT_MESSAGE_FIRSTBLOOD');
  if(fb){const k=c.P.find(p=>p.player_slot===fb.player_slot),v=c.P.find(p=>p.player_slot===fb.victim_player_slot)||c.P[+fb.key];
    if(k&&v)add({t:fb.time,tone:'info',tag:L('Перша кров','First blood','Первая кровь'),p:v,txt:L(`${H(k)} вбив ${H(v)}.`,`${H(k)} killed ${H(v)}.`,`${H(k)} убил ${H(v)}.`)})}
  (c.m.objectives||[]).filter(o=>o.type==='CHAT_MESSAGE_ROSHAN_KILL').forEach(o=>{const sd=o.team===2?'Radiant':'Dire';add({t:o.time,tone:'info',tag:L('Рошан','Roshan','Рошан'),p:null,txt:L(`Рошана вбили ${sd}.`,`${sd} killed Roshan.`,`Рошана убили ${sd}.`)})});
  const fr={};for(const b of c.buildings)if(b.rax){if(fr[b.side])continue;fr[b.side]=1;const sd=SIDE(b.side);
    add({t:b.t,tone:'info',tag:L('Перші казарми','First barracks','Первые казармы'),p:null,txt:L(`${sd} втратили ${b.name}.`,`${sd} lost ${b.name}.`,`${sd} потеряли ${b.name}.`)})}
  return E.sort((a,b)=>(a.t??-1)-(b.t??-1));
}

function topFacts(p){
  const w=W[p.pos];
  const asp=ASP_KEYS.map(k=>({a:p.A[k],w:w[k]})).filter(x=>x.a);
  const bad=asp.filter(x=>x.w>=.05).sort((a,b)=>(a.a.s-50)*a.w-(b.a.s-50)*b.w).flatMap(x=>x.a.F.filter(f=>f.c==='bad')).slice(0,4);
  const good=asp.slice().sort((a,b)=>(b.a.s-50)*b.w-(a.a.s-50)*a.w).flatMap(x=>x.a.F.filter(f=>f.c==='good')).slice(0,3);
  return{bad,good};
}

  else if(isC&&p.ruin>=52){stamp=L('Підозрюваний','Suspect','Подозреваемый');sc='mid';head=L('Головний підозрюваний.','Prime suspect.','Главный подозреваемый.');sub=L('Явного руїнера нема, але до нього найбільше питань.','No obvious ruiner, but this player raises the most questions.','Явного руинера нет, но к нему больше всего вопросов.')+weak}
  else if(isC){stamp=L('Не винний','Not guilty','Не виновен');sc='ok';head=L('Явного руїнера нема.','No obvious ruiner.','Явного руинера нет.');sub=L('Програли всією командою: кожен зіграв близько до норми своєї позиції. Цей гравець просто найслабший на тлі інших.','The whole team lost together: everyone played close to the norm for their position. This player is just the weakest of the group.','Проиграли всей командой: каждый сыграл близко к норме своей позиции. Этот игрок просто слабее остальных.')+weak}
  else{stamp=v.c>=3?L('Співучасник','Accomplice','Соучастник'):v.t;sc=v.c>=3?'':v.c>=2?'mid':'ok';head=v.c>=2?L('Теж приклав руку до поразки.','Also had a hand in the loss.','Тоже приложил руку к поражению.'):L('Не він головний винуватець.','Not the main culprit.','Не он главный виновник.');sub=rline+weak}
  const {bad,good}=topFacts(p);

function dumbHtml(p){

/* STRATZ: точні позиції по секундах (ключ зберігається лише в цьому браузері) */
const STZ={};
const stzKey=()=>{try{return localStorage.getItem('nf_stratz')||''}catch(e){return ''}};
async function loadStratz(id){
  if(STZ[id])return;STZ[id]={loading:true};
  const q='query($id:Long!){match(id:$id){id parsedDateTime players{playerSlot heroId playbackData{playerUpdatePositionEvents{time x y}}}}}';
  try{
    let r;
    try{r=await fetch('https://api.stratz.com/graphql',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+stzKey()},body:JSON.stringify({query:q,variables:{id:+id}})})}
    catch(e){throw new Error(L('Не вдалося зв’язатися з STRATZ. Перевір інтернет.','Couldn’t reach STRATZ. Check your connection.','Не удалось связаться с STRATZ. Проверь интернет.'))}
    if(r.status===401||r.status===403)throw new Error(L('STRATZ не прийняв ключ. Перевір, що скопіював його повністю.','STRATZ rejected the key. Make sure you copied all of it.','STRATZ не принял ключ. Проверь, что скопировал его полностью.'));
    if(r.status===429)throw new Error(L('Ліміт запитів STRATZ вичерпано. Спробуй пізніше.','STRATZ rate limit reached. Try later.','Лимит запросов STRATZ исчерпан. Попробуй позже.'));
    const j=await r.json();
    if(j.errors&&j.errors.length&&!(j.data&&j.data.match))throw new Error('STRATZ: '+j.errors.map(e=>e.message).join('; '));
    const m=j.data&&j.data.match;
    const players={};let any=false;
    for(const pl of(m&&m.players)||[]){const ev=pl.playbackData&&pl.playbackData.playerUpdatePositionEvents;if(Array.isArray(ev)&&ev.length){any=true;players[pl.playerSlot]=ev.map(e=>[e.time,e.x,e.y]).sort((a,b)=>a[0]-b[0])}}
    STZ[id]=any?{players}:{err:L('STRATZ ще не розібрав запис цього матчу. Відкрий матч на stratz.com — він стане в чергу, — і спробуй за кілька хвилин.','STRATZ hasn’t parsed this replay yet. Open the match on stratz.com to queue it and try again in a few minutes.','STRATZ ещё не разобрал запись этого матча. Открой матч на stratz.com — он встанет в очередь, — и попробуй через несколько минут.'),notParsed:true};
  }catch(e){STZ[id]={err:e.message}}
}
/* перерахунок координат STRATZ у сітку карти: зсув підбирається за позиціями OpenDota перших 10 хвилин */
function stzOffset(p,pts){
  const lp=p.lane_pos||{};let sx=0,sy=0,n=0;for(const x in lp)for(const y in lp[x]){const c=lp[x][y];sx+=x*c;sy+=y*c;n+=c}
  const early=pts.filter(q=>q[0]>=0&&q[0]<=600);
  if(!n||early.length<20)return[0,0];
  const ax=early.reduce((a,q)=>a+q[1],0)/early.length,ay=early.reduce((a,q)=>a+q[2],0)/early.length;
  const dx=sx/n-ax,dy=sy/n-ay;
  return Math.abs(dx)>2||Math.abs(dy)>2?[dx,dy]:[0,0];
}

function mapBind(el){

  const at=t=>{if(!path||!path.length)return null;let lo=0,hi=path.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(path[m][0]<=t)lo=m;else hi=m-1}return path[lo]};
  const here=q=>L(`${mmss(q[0])} — ${H(p)} тут`,`${mmss(q[0])} — ${H(p)} was here`,`${mmss(q[0])} — ${H(p)} здесь`);
  const show=e=>{const t=e.target.closest('[data-tip]');if(t){tip.textContent=t.dataset.tip;return}
    if(!path||!path.length)return;
    const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return;const v=pt.matrixTransform(m.inverse());

  <div class="note">${L('Число біля ворожого героя — як часто цей герой перемагає проти нього за статистикою OpenDota. Праворуч — середнє проти всієї ворожої п’ятірки. Зелене — вигідний матчап, червоне — невигідний.','The number next to each enemy is how often this hero wins against it per OpenDota stats. On the right is the average against the whole enemy five. Green = favourable, red = unfavourable.','Число возле вражеского героя — как часто этот герой побеждает против него по статистике OpenDota. Справа — среднее против всей вражеской пятёрки. Зелёное — выгодный матчап, красное — невыгодный.')}</div>`;
}

}

function benchHtml(p){

  return `<div class="bench">${rows.map(([k,l])=>{const pc=bp(p,k),raw=p.benchmarks[k].raw,c=pc<.25?3:pc<.45?2:pc<.7?1:0;
    const rv=k==='tower_damage'?num(raw):k.endsWith('per_min')&&raw<10?dec(raw,2):num(raw);
    return `<div class="bench-row c${c}"><span class="l">${l} <span class="mono">${rv}</span></span><span class="bar"><i style="--w:${Math.max(2,pc*100).toFixed(0)}%"></i></span><span class="v">${L('краще за','beats','лучше')} <b>${Math.round(pc*100)}%</b></span></div>`}).join('')}</div>

function deathsHtml(p){

    const fl=[];
    if(d.bb)fl.push(`<span class="flag bad">${L('байбек у таверну','wasted buyback','байбек в таверну')}</span>`);

    fl.push(d.fight?`<span class="flag info">${L('у бійці','teamfight','в драке')}</span>`:`<span class="flag info">${L('сам','alone','один')}</span>`);

    d.lostB.forEach(b=>fl.push(`<span class="flag ${b.big?'bad':'info'}">${L('впала','lost','упала')} ${esc(b.name)}</span>`));
    return `<tr><td class="mono" data-l="${hd[0]}">${mmss(d.t)}</td><td class="k" data-l="${hd[1]}">${d.killer?`<img src="${STEAM+d.killer.img}" alt="" onerror="this.remove()">${esc(d.killer.n)}`:`<span style="color:var(--muted)">${L('кріпи / вежа','creeps / tower','крипы / башня')}</span>`}</td><td class="mono" data-l="${hd[2]}">${d.fed!=null?num(d.fed):'—'}</td><td class="mono" data-l="${hd[3]}">${d.dead?d.dead+' '+sec:'—'}</td><td>${fl.join('')}</td></tr>`}).join('')}</tbody></table></div>`;

function blameHtml(){
  const row=(won)=>{
    const t=(won===!!S.m.radiant_win?S.sides.r:S.sides.d).slice().sort((a,b)=>won?a.ruin-b.ruin:b.ruin-a.ruin);

let graphNarrow=null;
function renderGraph(){
  const box=$('graphBox'),mode=S.gm||'gold';
  const adv=mode==='xp'?S.m.radiant_xp_adv:S.m.radiant_gold_adv;
  if(!Array.isArray(S.m.radiant_gold_adv)||S.m.radiant_gold_adv.length<2||!Array.isArray(adv)){box.hidden=true;return}
  box.hidden=false;
  const narrow=(box.clientWidth||innerWidth)<600;graphNarrow=narrow;
  const p=S.P[S.sel],dt=(p.dl||[]).map(d=>d.t);
  const W=narrow?440:820,Hh=narrow?250:240,Lp=narrow?40:48,Rp=narrow?8:14,T=12,B=26,iw=W-Lp-Rp,ih=Hh-T-B;
  const peak=Math.max(1000,...adv.map(Math.abs));
  const step=peak>20000?10000:peak>8000?5000:2000;
  const max=Math.ceil(peak/step)*step,n=adv.length-1;
  const x=i=>Lp+i/n*iw,y=v=>T+ih/2-(v/max)*(ih/2),mid=y(0);
  const pts=adv.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const area=`M${x(0)},${mid} L${pts.join(' L')} L${x(n)},${mid} Z`;
  let grid='';for(let v=-max;v<=max;v+=step){if(v===0)continue;grid+=`<line class="g-axis" x1="${Lp}" x2="${W-Rp}" y1="${y(v)}" y2="${y(v)}" opacity=".5"/><text class="g-txt" x="${Lp-6}" y="${y(v)+4}" text-anchor="end">${v>0?'+':'−'}${Math.abs(v)/1000}k</text>`}
  const tstep=narrow?(n>40?10:n>20?5:2):(n>50?10:n>24?5:n>10?2:1);
  let xt='';for(let i=0;i<=n;i+=tstep)xt+=`<text class="g-txt" x="${x(i)}" y="${Hh-6}" text-anchor="middle">${i}′</text>`;
  const valAt=s=>{const f=cl(s/60,0,n),i0=Math.floor(f),i1=Math.min(n,i0+1);return adv[i0]+(adv[i1]-adv[i0])*(f-i0)};
  const evs=[];
  (S.m.teamfights||[]).forEach(f=>{const x1=x(cl(f.start/60,0,n)),x2=x(cl(f.end/60,0,n)),dd=f.deaths||0;evs.push(`<rect class="g-tf" x="${x1}" y="${T}" width="${Math.max(3,x2-x1)}" height="${ih}"><title>${L('Бійка','Fight','Драка')} ${mmss(f.start)}–${mmss(f.end)} · ${dd} ${DEATHS(dd)}</title></rect>`)});
  (S.m.objectives||[]).filter(o=>o.type==='CHAT_MESSAGE_ROSHAN_KILL').forEach(o=>{const cx=x(cl(o.time/60,0,n));evs.push(`<g class="g-rosh"><circle cx="${cx}" cy="${T+9}" r="8" fill="${o.team===2?'var(--rad)':'var(--dire)'}"/><text x="${cx}" y="${T+12.5}" text-anchor="middle">R</text><title>${L('Рошан','Roshan','Рошан')} ${mmss(o.time)} · ${o.team===2?'Radiant':'Dire'}</title></g>`)});
  (S.buildings||[]).filter(b=>b.big||/^T2/.test(b.name)).forEach(b=>{const cx=x(cl(b.t/60,0,n)),yy=T+ih-4;evs.push(`<path class="g-bld" d="M${cx-5},${yy-8} L${cx+5},${yy-8} L${cx},${yy} Z" fill="${b.side==='r'?'var(--rad)':'var(--dire)'}"><title>${b.side==='r'?'Radiant':'Dire'} ${L('втратили','lost','потеряли')} ${b.name} · ${mmss(b.t)}</title></path>`)});
  const died=L('помер на','died at','умер на');
  const dots=dt.map(s=>{const cx=x(cl(s/60,0,n)),cy=y(valAt(s));return `<line class="g-death-l" x1="${cx}" x2="${cx}" y1="${cy}" y2="${mid}"/><circle class="g-death" cx="${cx}" cy="${cy}" r="${narrow?4:5}"><title>${esc(pname(p))} ${died} ${mmss(s)}</title></circle>`}).join('');
  box.innerHTML=`
  <div class="box-h"><h2>${mode==='xp'?L('Перевага в досвіді','XP advantage','Преимущество в опыте'):L('Перевага в золоті','Gold advantage','Преимущество в золоте')}</h2><div class="seg"><button type="button" data-g="gold" class="${mode==='gold'?'on':''}">${L('Золото','Gold','Золото')}</button>${Array.isArray(S.m.radiant_xp_adv)?`<button type="button" data-g="xp" class="${mode==='xp'?'on':''}">${L('Досвід','XP','Опыт')}</button>`:''}</div></div>
  <div class="graph"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${L('Графік переваги по хвилинах','Advantage by minute','График преимущества по минутам')}">
    <defs><clipPath id="cTop"><rect x="0" y="0" width="${W}" height="${mid}"/></clipPath><clipPath id="cBot"><rect x="0" y="${mid}" width="${W}" height="${Hh-mid}"/></clipPath></defs>
    ${grid}
    ${evs.join('')}
    <path class="g-rad" d="${area}" clip-path="url(#cTop)"/><path class="g-dire" d="${area}" clip-path="url(#cBot)"/>
    <line class="g-zero" x1="${Lp}" x2="${W-Rp}" y1="${mid}" y2="${mid}"/>
    <polyline class="g-line" points="${pts.join(' ')}"/>
    ${dots}${xt}
  </svg></div>
  <div class="legend"><span><i style="background:var(--rad)"></i>${L('Radiant попереду','Radiant ahead','Radiant впереди')}</span><span><i style="background:var(--dire)"></i>${L('Dire попереду','Dire ahead','Dire впереди')}</span>${dt.length?`<span><i style="background:var(--t3);border-radius:50%"></i>${L('Смерті','Deaths','Смерти')}: ${esc(pname(p))} (${esc(H(p))})</span>`:''}<span><i style="background:rgba(255,255,255,.18)"></i>${L('командні бійки','teamfights','командные драки')}</span><span><i style="background:var(--tape);border-radius:50%"></i>R — ${L('Рошан','Roshan','Рошан')}</span><span>▼ ${L('впали T2, T3, казарми','T2, T3, barracks fell','упали T2, T3, казармы')}</span></div>`;
  box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.gm=b.dataset.g;renderGraph()});
}

function renderTeams(){

async function fromStratz(id){
  const q='query($id:Long!){match(id:$id){id didRadiantWin durationSeconds startDateTime gameMode lobbyType players{playerSlot isRadiant heroId kills deaths assists numLastHits numDenies goldPerMinute experiencePerMinute level networth heroDamage towerDamage heroHealing leaverStatus position item0Id item1Id item2Id item3Id item4Id item5Id neutral0Id steamAccountId steamAccount{name seasonRank}}}}';
  let r;
  try{r=await fetch('https://api.stratz.com/graphql',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+stzKey()},body:JSON.stringify({query:q,variables:{id:+id}})})}
  catch(e){throw new Error(L('Не вдалося зв’язатися з STRATZ.','Couldn’t reach STRATZ.','Не удалось связаться с STRATZ.'))}
  if(r.status===401||r.status===403)throw new Error(L('STRATZ не прийняв ключ. Перевір, що скопіював його повністю.','STRATZ rejected the key. Make sure you copied all of it.','STRATZ не принял ключ. Проверь, что скопировал его полностью.'));
  if(r.status===429)throw new Error(L('Ліміт запитів STRATZ вичерпано. Спробуй пізніше.','STRATZ rate limit reached. Try later.','Лимит запросов STRATZ исчерпан. Попробуй позже.'));
  const j=await r.json(),mm=j.data&&j.data.match;
  if(!mm){if(j.errors&&j.errors.length)throw new Error('STRATZ: '+j.errors.map(e=>e.message).join('; ').slice(0,240));throw new Error(L('STRATZ теж не знає цього матчу.','STRATZ doesn’t know this match either.','STRATZ тоже не знает этот матч.'))}
  if(!Array.isArray(mm.players)||mm.players.length<2||!mm.durationSeconds||mm.didRadiantWin==null)throw new Error(L('STRATZ ще не має результату цього матчу.','STRATZ doesn’t have this match result yet.','У STRATZ ещё нет результата этого матча.'));
  const pos=v=>{const d=String(v||'').match(/(\d)/);return d?+d[1]:undefined};
  const players=mm.players.map(p=>({player_slot:p.playerSlot,isRadiant:!!p.isRadiant,hero_id:p.heroId,kills:p.kills||0,deaths:p.deaths||0,assists:p.assists||0,last_hits:p.numLastHits||0,denies:p.numDenies||0,gold_per_min:p.goldPerMinute||0,xp_per_min:p.experiencePerMinute||0,level:p.level,net_worth:p.networth||0,hero_damage:p.heroDamage||0,tower_damage:p.towerDamage||0,hero_healing:p.heroHealing||0,
    leaver_status:!p.leaverStatus||p.leaverStatus==='NONE'?0:p.leaverStatus==='DISCONNECTED'?1:3,position_est:pos(p.position),
    item_0:p.item0Id||0,item_1:p.item1Id||0,item_2:p.item2Id||0,item_3:p.item3Id||0,item_4:p.item4Id||0,item_5:p.item5Id||0,item_neutral:p.neutral0Id||0,
    account_id:p.steamAccountId||null,personaname:p.steamAccount&&p.steamAccount.name||null,rank_tier:p.steamAccount&&p.steamAccount.seasonRank||null}));
  const sc=r=>players.filter(p=>p.isRadiant===r).reduce((a,p)=>a+p.kills,0);
  return{match_id:+id,duration:mm.durationSeconds,radiant_win:!!mm.didRadiantWin,start_time:mm.startDateTime,game_mode:SGM[mm.gameMode],lobby_type:SLT[mm.lobbyType],radiant_score:sc(true),dire_score:sc(false),players,_src:'stratz'};
}

/* ---- кеш матчів у браузері: IndexedDB, до 30 матчів; важкі невикористані поля прибираються ---- */
const MC_MAX=30,MC_IDX='nf_mc_idx',memC=new Map();
let idbP=null;
function idb(){
  if(idbP)return idbP;
  idbP=new Promise(res=>{try{const r=indexedDB.open('nafidyv',1);r.onupgradeneeded=()=>{try{r.result.createObjectStore('m')}catch(e){}};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
  return idbP;
}
const SLIM_P=['cosmetics','ability_targets','damage_inflictor_received','hero_hits','item_win','item_usage','actions','life_state','neutral_tokens_log','permanent_buffs','damage_targets','camps_stacked_t','tower_damage_t','hero_damage_t','hero_healing_t','networth_t','times'];
function slim(m){const o={...m};['cosmetics','all_word_counts','my_word_counts','od_data','metadata'].forEach(k=>delete o[k]);o.players=(m.players||[]).map(p=>{const q={...p};SLIM_P.forEach(k=>delete q[k]);return q});return o}
async function cacheGet(id){
  id=String(id);if(memC.has(id))return memC.get(id);
  const db=await idb();if(!db)return null;
  return new Promise(res=>{try{const q=db.transaction('m').objectStore('m').get(id);q.onsuccess=()=>{const v=q.result||null;if(v)memC.set(id,v);res(v)};q.onerror=()=>res(null)}catch(e){res(null)}});
}
async function cachePut(id,m){
  id=String(id);const v={t:Date.now(),m:slim(m),v4:1};memC.set(id,v);if(memC.size>MC_MAX)memC.delete(memC.keys().next().value);
  const db=await idb();if(!db)return;
  try{
    let idx=(store.get(MC_IDX)||[]).filter(x=>x!==id);idx.push(id);
    const st=db.transaction('m','readwrite').objectStore('m');st.put(v,id);
    while(idx.length>MC_MAX){const old=idx.shift();st.delete(old)}
    store.set(MC_IDX,idx);
  }catch(e){}
}
const matchOk=m=>m&&Array.isArray(m.players)&&m.players.length>1&&m.duration&&m.radiant_win!=null&&!m.players.every(p=>!p.hero_id);
/* розпарсений матч уже не зміниться — беремо з кешу; нерозпарсений — лише якщо йому < 10 хв */
async function getMatch(id){
  const c=await cacheGet(id);
  /* v4: у старому кеші без натискань скілів (c.v4) — розпарсений матч перезавантажуємо один раз */
  if(c&&c.m&&((c.m.version!=null&&c.v4)||Date.now()-c.t<10*60*1000))return c.m;
  const m=await getJson(API+'/matches/'+id);
  if(matchOk(m))cachePut(id,m);
  return m;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- акаунти (лише в цьому браузері) ---- */
const ACC_KEY='nf_accs';
function accs(){const a=store.get(ACC_KEY);return a&&Array.isArray(a.list)?a:{me:null,list:[]}}
function saveAccs(a){store.set(ACC_KEY,a)}
const steam32=s=>{try{return Number(BigInt(s)-76561197960265728n)}catch(e){return null}};
function parseAccount(raw){
  const s=String(raw||'').trim();if(!s)return null;let m;
  if((m=s.match(/(?:opendota\.com|dotabuff\.com|stratz\.com)\/players\/(\d+)/i)))return{id:+m[1]};
  if((m=s.match(/steamcommunity\.com\/profiles\/(\d{17})/i)))return{id:steam32(m[1])};
  if((m=s.match(/steamcommunity\.com\/id\/([^\/?#]+)/i)))return{q:decodeURIComponent(m[1])};
  if(/^\d{17}$/.test(s))return{id:steam32(s)};
  if(/^\d{3,10}$/.test(s))return{id:+s};
  return{q:s};
}
async function addAccount(id,asMe){
  const pr=await getJson(API+'/players/'+id,null,true);
  if(!pr||!pr.profile)throw new Error(L('OpenDota не знає такого гравця або його профіль прихований.','OpenDota doesn’t know this player or the profile is hidden.','OpenDota не знает такого игрока или его профиль скрыт.'));
  const a=accs(),e={id:+id,name:pr.profile.personaname||('#'+id),avatar:pr.profile.avatarfull||pr.profile.avatar||'',rank:pr.rank_tier||null};
  a.list=a.list.filter(x=>x.id!==e.id);a.list.push(e);if(asMe||!a.me)a.me=e.id;saveAccs(a);return e;
}
function removeAccount(id){const a=accs();a.list=a.list.filter(x=>x.id!==id);if(a.me===id)a.me=a.list[0]?a.list[0].id:null;saveAccs(a)}
const V={view:'match',acc:null,addOpen:false,found:null,addErr:'',busy:false,n:20};
const curAcc=()=>{const a=accs();const id=V.acc&&a.list.some(x=>x.id===V.acc)?V.acc:a.me;return a.list.find(x=>x.id===id)||null};

}
function addForm(){
  const first=!accs().list.length;
  return `<div class="addacc">
    <b>${first?L('Вкажи свій акаунт Dota 2','Add your Dota 2 account','Укажи свой аккаунт Dota 2'):L('Додати друга','Add a friend','Добавить друга')}</b>
    <p>${L('Посилання на Steam, код друга з Доти, посилання на OpenDota / Dotabuff / STRATZ або нік. Зберігається лише в цьому браузері.','A Steam link, Dota friend code, OpenDota / Dotabuff / STRATZ link or a nickname. Stored only in this browser.','Ссылка на Steam, код друга из Доты, ссылка на OpenDota / Dotabuff / STRATZ или ник. Хранится только в этом браузере.')}</p>
    <form class="stz-row" id="accForm" autocomplete="off"><input id="accIn" placeholder="${L('напр. 1679777916 або steamcommunity.com/id/…','e.g. 1679777916 or steamcommunity.com/id/…','напр. 1679777916 или steamcommunity.com/id/…')}" aria-label="${L('Акаунт','Account','Аккаунт')}"><button type="submit"${V.busy?' disabled':''}>${V.busy?L('Шукаю…','Searching…','Ищу…'):L('Додати','Add','Добавить')}</button></form>
    ${V.addErr?`<div class="c3" style="margin-top:8px">${esc(V.addErr)}</div>`:''}
    ${V.found?(V.found.length?`<div class="found">${V.found.slice(0,8).map(x=>`<button type="button" class="acc" data-pick="${x.account_id}">${x.avatarfull?`<img src="${esc(x.avatarfull)}" alt="">`:''}<span>${esc(x.personaname||'#'+x.account_id)}</span><small>ID ${x.account_id}</small></button>`).join('')}</div>`:`<div class="empty">${L('Нікого не знайдено. Спробуй посилання або ID.','Nobody found. Try a link or an ID.','Никого не найдено. Попробуй ссылку или ID.')}</div>`):''}
  </div>`;
}
function bindAccBar(el,rerender){
  el.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{V.acc=+b.dataset.acc;rerender()});
  const ad=el.querySelector('[data-addacc]');if(ad)ad.onclick=()=>{V.addOpen=!V.addOpen;V.found=null;V.addErr='';rerender()};

      else{const r=await getJson(API+'/search?q='+encodeURIComponent(v.q),null,true);V.found=Array.isArray(r)?r:[]}}
    catch(err){V.addErr=err.message}

}

function renderNav(){$('nav').innerHTML=VIEWS().map(([k,n])=>`<button type="button" data-view="${k}" class="${V.view===k?'on':''}" aria-current="${V.view===k?'page':'false'}">${n}</button>`).join('');$('nav').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view,true))}

  $('vMatchHead').hidden=!isM;$('result').hidden=!isM||!S;$('vMy').hidden=v!=='my';$('vStats').hidden=v!=='stats';$('vCrew').hidden=v!=='crew';

/* ---- час «тому» ---- */
function ago(t){const d=(Date.now()/1000-t);if(d<3600)return L(`${Math.max(1,Math.round(d/60))} хв тому`,`${Math.max(1,Math.round(d/60))} min ago`,`${Math.max(1,Math.round(d/60))} мин назад`);if(d<86400){const h=Math.round(d/3600);return L(`${h} год тому`,`${h} h ago`,`${h} ч назад`)}if(d<172800)return L('вчора','yesterday','вчера');return fdate(t)}
const isWin=m=>(m.player_slot<128)===m.radiant_win;

/* ---- короткий вердикт матчу для конкретного гравця ---- */
const VCACHE={};
async function verdictFor(mid,acc){
  const key=mid+':'+acc;if(VCACHE[key])return VCACHE[key];
  await loadTables();const m=await getMatch(mid);if(!matchOk(m))throw new Error('no match');
  const c=analyze(m),me=c.P.find(p=>p.account_id===acc);
  const v={won:me?me.won:null,ruin:me?me.ruin:null,verd:me?verdOf(me.ruin):null,meCulprit:me&&me===c.culprit,meMvp:me&&me===c.mvp,culprit:{hero:c.culprit.hero_id,ruin:c.culprit.ruin,name:pname(c.culprit)},mvp:c.mvp?{hero:c.mvp.hero_id,ruin:c.mvp.ruin}:null,parsed:c.parsed};
  VCACHE[key]=v;return v;
}

/* рядок статистики гравця з розібраного матчу */
function statRow(c,me){
  const dl=me.dl||[],out=dl.filter(d=>!d.fight),G=me.X&&me.X.gold,tk=tsum(me.team,'kills')||1;
  const iu=me.item_uses||{},tp=me.item_uses?(iu.tpscroll||0):null;
  return{mid:c.m.match_id,t:c.m.start_time,dur:c.dur,won:me.won,hero:me.hero_id,pos:me.pos,ruin:me.ruin,culprit:me===c.culprit,mvp:me===c.mvp,
    k:me.kills||0,d:me.deaths||0,a:me.assists||0,asp:Object.fromEntries(ASP_KEYS.map(k=>[k,me.A[k]?me.A[k].s:null])),parsed:c.parsed,
    outD:me.dl?out.length:0,outFed:out.reduce((s,d)=>s+(d.fed||0),0),outEarly:out.filter(d=>d.t<600).length,
    laneNw:me.A.lane?me.A.lane.nwD:null,laneOpp:me.opp?me.opp.hero_id:null,
    kp:((me.kills||0)+(me.assists||0))/tk,kpN:KP_NORM[me.pos],gpmPct:bp(me,'gold_per_min'),
    bkbIdle:(me.X&&me.X.fights||[]).filter(f=>f.bkbIdle).length,unused:(me.X&&me.X.items||[]).filter(i=>i.bad).map(i=>i.key),
    tp,tp10:tp!=null?tp/(c.dur/600):null,w10:c.parsed?((me.obs_placed||0)+(me.sen_placed||0))/(c.dur/600):null,
    dumb:me.D?me.D.pts:0,dumbK:me.D?me.D.F.map(f=>f.k).filter(k=>ITEMK[k]):[],
    nshare:G&&G.total?G.g.neutral/G.total:0,jungle:!!(G&&G.total&&G.g.neutral/G.total>=.4&&((me.kills||0)+(me.assists||0))/tk<KP_NORM[me.pos]-.1)};
}

/* ---- збирання статистики по N матчах (з кешем і паузами, щоб не впертися в ліміт) ---- */
const STJ={};
async function buildRows(acc,list,job,onTick){
  await loadTables();job.total=list.length;job.done=0;job.rows=[];
  for(const m of list){
    if(job.cancel)return;
    const cached=await cacheGet(m.match_id);
    try{const mm=await getMatch(m.match_id);if(matchOk(mm)){const c=analyze(mm),me=c.P.find(p=>p.account_id===acc);if(me)job.rows.push(statRow(c,me))}}
    catch(e){if(e.status===429){await sleep(20000)}}
    job.done++;onTick&&onTick();
    if(!(cached&&cached.m&&cached.m.version!=null&&cached.v4))await sleep(1100);
  }
}
function renderStats(){
  const el=$('vStats'),c=curAcc();
  let h=`<div class="vhead"><h2>${L('Моя статистика','My stats','Моя статистика')}</h2><p>${L('Розбір твоїх останніх ігор без Турбо: де ти найчастіше помиляєшся і що виправити.','A breakdown of your recent non-Turbo games: where you go wrong most often and what to fix.','Разбор твоих последних игр без Турбо: где ты чаще всего ошибаешься и что исправить.')}</p></div>${accBar()}`;
  if(!c){el.innerHTML=h;bindAccBar(el,renderStats);return}
  const key=c.id+':'+V.n,job=STJ[key];
  h+=`<div class="seg" style="margin:4px 0 14px">${[20,50].map(n=>`<button type="button" data-n="${n}" class="${V.n===n?'on':''}">${n} ${L('ігор','games','игр')}</button>`).join('')}</div>`;
  if(!job){
    STJ[key]={loading:true,done:0,total:V.n};
    (async()=>{const j=STJ[key];try{const r=await getJson(API+`/players/${c.id}/matches?limit=${V.n*2+10}`,null,true);const list=(Array.isArray(r)?r:[]).filter(m=>m.game_mode!==23).slice(0,V.n);
      await buildRows(c.id,list,j,()=>{if(V.view==='stats'&&curAcc()?.id===c.id&&V.n===+key.split(':')[1])throttle(renderStats)})}catch(e){j.err=e.message}j.loading=false;if(V.view==='stats')renderStats()})();
  }
  const j=STJ[key];
  if(j.err&&!(j.rows&&j.rows.length)){el.innerHTML=h+`<div class="empty c3">${esc(j.err)}</div>`;bindStats(el);return}
  if(j.loading)h+=`<div class="prog"><span>${L('Розбираю матчі','Analysing matches','Разбираю матчи')}: ${j.done||0} / ${j.total||V.n}</span><div class="meter c1"><i style="--w:${Math.round((j.done||0)/(j.total||V.n)*100)}%"></i></div></div>`;
  const rows=j.rows||[];
  if(rows.length>=3)h+=statsBody(rows);else if(!j.loading)h+=`<div class="empty">${L('Замало розібраних матчів.','Too few analysed matches.','Слишком мало разобранных матчей.')}</div>`;
  el.innerHTML=h;bindStats(el);
}
let thrT=0;function throttle(f){const n=Date.now();if(n-thrT>700){thrT=n;f()}else{clearTimeout(throttle.t);throttle.t=setTimeout(()=>{thrT=Date.now();f()},700)}}
function bindStats(el){
  bindAccBar(el,renderStats);
  el.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{V.n=+b.dataset.n;renderStats()});
  el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMatch(b.dataset.open));
}
function statsBody(rows){
  const N=rows.length,wins=rows.filter(r=>r.won).length,losses=N-wins,cul=rows.filter(r=>r.culprit).length,mvp=rows.filter(r=>r.mvp).length;
  const avgR=avg(rows.map(r=>r.ruin)),posC={};rows.forEach(r=>posC[r.pos]=(posC[r.pos]||0)+1);const favPos=Object.entries(posC).sort((a,b)=>b[1]-a[1])[0];
  const aspAvg=ASPECTS().map(([k,n])=>{const v=rows.map(r=>r.asp[k]).filter(x=>x!=null);return{k,n,v:v.length?avg(v):null,cnt:v.length}}).filter(x=>x.v!=null&&x.cnt>=Math.min(3,N)&&(x.k!=='vision'||rows.filter(r=>r.pos>=4).length>=N/2));

function ruinSpark(rs){

  return `<div class="sec-h"><h3>${L('Руїнометр гра за грою','Ruin meter game by game','Руинометр игра за игрой')}</h3><small>${L('від старих до нових; вище — гірше','oldest to newest; higher is worse','от старых к новым; выше — хуже')}</small></div>

}

      await loadTables();const seen=new Map();
      for(const f of fr.slice(0,6)){const r=await getJson(API+`/players/${me.id}/matches?included_account_id=${f.id}&limit=25`,null,true);(Array.isArray(r)?r:[]).filter(m=>m.game_mode!==23).forEach(m=>seen.set(m.match_id,m));await sleep(900)}

  g.fillStyle='#8a93a3';g.font='700 18px JetBrains Mono, monospace';g.fillText(L('ХТО НАФІДИВ?','WHO FED?','КТО НАФИДИЛ?'),x0,130);
  const isC=p===S.culprit;
  const head=p.won?(p.ruin<38?L('Тащив гру','Carried the game','Тащил игру'):L('Переміг','Won','Победил')):isC&&p.ruin>=62?L('Злив гру','Threw the game','Слил игру'):isC&&p.ruin>=52?L('Головний підозрюваний','Prime suspect','Главный подозреваемый'):L('Не головний винуватець','Not the main culprit','Не главный виновник');
  g.fillStyle='#e8ebf0';g.font='900 54px Unbounded, Arial Black, sans-serif';g.fillText(head,x0,200,660-x0);
  g.font='800 34px Unbounded, Arial Black, sans-serif';g.fillStyle='#cfd4dd';g.fillText(pname(p).slice(0,24),x0,252,660-x0);
  g.font='500 22px Onest, Segoe UI, sans-serif';g.fillStyle='#8a93a3';g.fillText(`${H(p)} · ${POS(p.pos)} · ${p.rad?'Radiant':'Dire'}`,x0,290);
  g.fillStyle=vc;g.font='900 150px Unbounded, Arial Black, sans-serif';g.fillText(String(p.ruin),x0,450);
  const nw=g.measureText(String(p.ruin)).width;g.font='800 26px Unbounded, Arial Black, sans-serif';g.fillText(`${RUIN().toUpperCase()} · ${v.t.toUpperCase()}`,x0+nw+24,400,640-x0-nw);
  g.font='700 24px JetBrains Mono, monospace';g.fillStyle='#8a93a3';g.fillText(`/100`,x0+nw+24,446);
  g.fillStyle='#e8ebf0';g.font='700 28px JetBrains Mono, monospace';g.fillText(`K/D/A ${p.kills}/${p.deaths}/${p.assists}   GPM ${p.gold_per_min||0}`,x0,510,660-x0);
  g.fillStyle='#8a93a3';g.font='500 22px Onest, Segoe UI, sans-serif';g.fillText(`Radiant ${m.radiant_score??''} : ${m.dire_score??''} Dire · ${mmss(S.dur)} · ${matchUrl(m.match_id).replace(/^https?:\/\//,'')}`,x0,560,660-x0);
  if(p.D&&p.D.pts){g.fillStyle=col('--tape')||'#f5c443';g.font='600 19px Onest, Segoe UI, sans-serif';g.fillText(`${DUMB(p).toUpperCase()}-${L('БАЛИ','POINTS','БАЛЛЫ')} +${p.D.pts}${p.D.whatIf?' · '+whatIfTxt(p.D.whatIf):''}`,x0,598,W-x0-40)}
  return cv;
}
async function shareCard(){
  const m=S.m,cv=await drawCard();
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  if(!blob){toast(L('Не вдалося створити картинку.','Couldn’t create the image.','Не удалось создать картинку.'));return}
  const file=new File([blob],`nafidyv-${m.match_id}.png`,{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:matchUrl(m.match_id)});return}}catch(e){if(e&&e.name==='AbortError')return}
  let copied=false;try{if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);copied=true}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  toast(copied?L('Картинку скопійовано й збережено — встав у чат (Ctrl+V).','Image copied and saved — paste it into the chat (Ctrl+V).','Картинка скопирована и сохранена — вставь в чат (Ctrl+V).'):L('Картинку збережено.','Image saved.','Картинка сохранена.'));
}
async function shareLink(){const ok=await copyText(matchUrl(S.m.match_id));toast(ok?L('Посилання скопійовано.','Link copied.','Ссылка скопирована.'):matchUrl(S.m.match_id))}

/* ---- поради з цифрами для гравця в матчі ---- */
const BM={};
function loadBench(hid){
  if(BM[hid])return BM[hid].p||Promise.resolve();
  const c=store.get('nf_bm_'+hid);if(c&&Date.now()-c.t<7*864e5){BM[hid]={v:c.v};return Promise.resolve()}
  const p=getJson(API+'/benchmarks?hero_id='+hid,null,true).then(j=>{const v={};for(const k of['gold_per_min','xp_per_min','last_hits_per_min','hero_damage_per_min']){const a=j&&j.result&&j.result[k];const r=a&&a.find(x=>Math.abs(x.percentile-.5)<.01);if(r)v[k]=r.value}BM[hid]={v};store.set('nf_bm_'+hid,{t:Date.now(),v})}).catch(()=>{BM[hid]={v:null}});
  BM[hid]={p};return p;
}
const BIG_EQ=['blink','black_king_bar','ultimate_scepter','desolator','manta','butterfly','skadi','satanic','greater_crit','heart','assault'];
function tipsFor(p){
  const T=[],min=S.dur/60;
  /* 1. проти середнього гравця на цьому герої */
  const b=BM[p.hero_id];
  if(!b)loadBench(p.hero_id).then(()=>{if(S&&S.P[S.sel]===p)renderDossier()});
  else if(b.v){
    const cand=[['gold_per_min','GPM',p.gold_per_min],['last_hits_per_min',L('добивання за хв','last hits/min','добивания в мин'),(p.last_hits||0)/min],['xp_per_min','XPM',p.xp_per_min],['hero_damage_per_min',L('шкода за хв','damage/min','урон в мин'),(p.hero_damage||0)/min]].filter(([k])=>b.v[k]!=null&&bp(p,k)!=null).sort((x,y)=>bp(p,x[0])-bp(p,y[0]))[0];
    if(cand&&bp(p,cand[0])<.4){const [k,n,val]=cand,med=b.v[k],diff=med-val;
      const extra=k==='last_hits_per_min'?L(` Це ≈ ${Math.round(diff*10)} крипів за кожні 10 хвилин.`,` That’s ≈ ${Math.round(diff*10)} creeps every 10 minutes.`,` Это ≈ ${Math.round(diff*10)} крипов за каждые 10 минут.`):k==='gold_per_min'?L(` За гру це ≈ ${num(diff*min)} золота.`,` Over the game that’s ≈ ${num(diff*min)} gold.`,` За игру это ≈ ${num(diff*min)} золота.`):'';
      T.push(L(`${n}: у тебе ${dec(val,k==='last_hits_per_min'?1:0)}, у середнього гравця на ${H(p)} — ${dec(med,k==='last_hits_per_min'?1:0)}.${extra}`,`${n}: you ${dec(val,k==='last_hits_per_min'?1:0)}, an average ${H(p)} player ${dec(med,k==='last_hits_per_min'?1:0)}.${extra}`,`${n}: у тебя ${dec(val,k==='last_hits_per_min'?1:0)}, у среднего игрока на ${H(p)} — ${dec(med,k==='last_hits_per_min'?1:0)}.${extra}`))}
  }
  /* 2. смерті там, де не було вашого вижену */
  const dl=p.dl||[];
  if(S.parsed&&dl.length>=3){
    const sz=STZ[S.m.match_id],raw=sz&&sz.players&&sz.players[p.player_slot];
    const tf=(S.m.teamfights||[]).map(f=>{const x=f.players&&f.players[p.i],l=[];if(x&&x.deaths_pos)for(const px in x.deaths_pos)for(const py in x.deaths_pos[px])l.push([+px,+py]);return{s:f.start,e:f.end,l}});
    const posAt=t=>{if(raw&&raw.length){let lo=0,hi=raw.length-1;if(raw[0][0]>t)return null;while(lo<hi){const m=(lo+hi+1)>>1;if(raw[m][0]<=t)lo=m;else hi=m-1}return[raw[lo][1],raw[lo][2]]}const f=tf.find(f=>t>=f.s-3&&t<=f.e+3&&f.l.length);return f?f.l[0]:null};
    const obs=p.team.flatMap(q=>(q.X&&q.X.wards||[]).filter(w=>w.type==='obs'));
    let known=0,blind=0;
    for(const d of dl){const xy=posAt(d.t);if(!xy)continue;known++;const seen=obs.some(w=>w.t<=d.t&&d.t<=w.t+w.life&&Math.hypot(w.x-xy[0],w.y-xy[1])<=13);if(!seen)blind++}
    if(known>=3&&blind/known>=.5)T.push(L(`${blind} з ${known} смертей сталися там, де не стояв жоден ваш обсервер: ворога ти бачив лише тоді, коли вже було пізно.`,`${blind} of ${known} deaths happened where none of your observers were: you saw the enemy only when it was too late.`,`${blind} из ${known} смертей случились там, где не стоял ни один ваш обсервер: врага ты видел, только когда было поздно.`));
  }
  /* 3. скільки золота отримав з тебе один ворог */
  if(dl.length&&dl.some(d=>d.fed!=null)){const by={};dl.forEach(d=>{if(d.killer&&d.fed)by[d.killer.n]=(by[d.killer.n]||0)+d.fed});
    const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
    if(top&&top[1]>=1500){const it=BIG_EQ.map(k=>ITEMK[k]).filter(Boolean).filter(i=>i.cost<=top[1]).sort((a,b)=>b.cost-a.cost)[0];
      T.push(L(`${top[0]} отримав з тебе ${num(top[1])} золота${it?` — це ${it.n} (${num(it.cost)})`:''}. Варто тримати дистанцію від нього або купити від нього захист.`,`${top[0]} got ${num(top[1])} gold off you${it?` — that’s a ${it.n} (${num(it.cost)})`:''}. Keep distance from them or buy protection against them.`,`${top[0]} получил с тебя ${num(top[1])} золота${it?` — это ${it.n} (${num(it.cost)})`:''}. Стоит держать дистанцию от него или купить от него защиту.`))}}
  /* 4. ліс замість бійок */
  const G=p.X&&p.X.gold,tk=tsum(p.team,'kills')||1;
  if(G&&G.total&&p.pos<=3&&G.g.neutral/G.total>=.4&&((p.kills||0)+(p.assists||0))/tk<KP_NORM[p.pos]-.1)T.push(L(`${pct(G.g.neutral/G.total)} золота — з лісу, а з ${tk} вбивств команди ти був лише в ${(p.kills||0)+(p.assists||0)}.`,`${pct(G.g.neutral/G.total)} of gold came from the jungle, yet you were in only ${(p.kills||0)+(p.assists||0)} of the team’s ${tk} kills.`,`${pct(G.g.neutral/G.total)} золота — из леса, а из ${tk} убийств команды ты был только в ${(p.kills||0)+(p.assists||0)}.`));
  return T.slice(0,3);
}

function showSkel(){const r=$('result');r.hidden=false;r.classList.add('loading');$('dossier').innerHTML=`<div class="dossier-grid"><div><span class="sk-b" style="aspect-ratio:16/10;height:auto;width:100%;border-radius:8px"></span></div><div class="sk-col"><span class="sk-b" style="width:40%"></span><span class="sk-b" style="width:80%;height:30px"></span><span class="sk-b" style="width:60%"></span><span class="sk-b" style="width:30%;height:60px"></span><span class="sk-b" style="width:100%;height:56px"></span><span class="sk-b" style="width:90%"></span><span class="sk-b" style="width:85%"></span></div></div>`}
function unskel(){const r=$('result');r.classList.remove('loading');if(S)render();else r.hidden=true}

function show(m){S=analyze(m);S.sel=S.culprit.i;render();saveHistory()}

async function run(raw){
  const id=parseId(raw);
  if(!id){setStatus(L(`Не бачу ID матчу. Встав число на зразок ${EXAMPLE} або посилання на матч.`,`I can’t see a match ID. Paste a number like ${EXAMPLE} or a match link.`,`Не вижу ID матча. Вставь число вроде ${EXAMPLE} или ссылку на матч.`),'err');return}
  clearInterval(pollTimer);clearInterval(waitTimer);
  if(V.view!=='match')setView('match',false);
  $('mid').value=id;$('go').disabled=true;$('mid').blur();
  setStatus(L(`Дістаю матч ${id} з OpenDota…`,`Fetching match ${id} from OpenDota…`,`Достаю матч ${id} из OpenDota…`),'load');
  try{
    showSkel();
    const [m]=await Promise.all([getMatch(id),loadConst(),loadTables()]);
    if(!m||!Array.isArray(m.players)||m.players.length<2)throw new Error(L('OpenDota повернув матч без гравців. Спробуй інший ID.','OpenDota returned a match with no players. Try another ID.','OpenDota вернул матч без игроков. Попробуй другой ID.'));
    if(!m.duration||m.radiant_win==null||m.players.every(p=>!p.hero_id))throw new Error(L('Цей матч ще йде або OpenDota ще не отримав його результат. Спробуй через кілька хвилин після кінця гри.','This match is still in progress or OpenDota doesn’t have the result yet. Try a few minutes after the game ends.','Этот матч ещё идёт или OpenDota ещё не получил его результат. Попробуй через несколько минут после конца игры.'));
    show(m);setStatus('');
    try{history.replaceState(null,'','#'+id)}catch(e){}
    $('result').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  }catch(e){unskel();if(e.status===404){fallback(id);return}console.error(e);setStatus(e.message,'err')}
  finally{$('go').disabled=false}
}

function saveHistory(){
  const c=S.culprit,h=(store.get('nf_hist')||[]).filter(x=>x.id!==String(S.m.match_id));
  h.unshift({id:String(S.m.match_id),hero:c.hero_id,name:pname(c)});
  store.set('nf_hist',h.slice(0,8));renderChips();
}
function renderChips(){
  const h=store.get('nf_hist')||[];
  let html;
  if(!h.length)html=`<span class="lbl">${L('Приклад:','Example:','Пример:')}</span><button type="button" class="chip plain" data-id="${EXAMPLE}">${EXAMPLE}</button>`;
  else html=`<span class="lbl">${L('Нещодавні:','Recent:','Недавние:')}</span>`+h.map(x=>{const hh=HEROES&&HEROES[x.hero];return `<button type="button" class="chip${hh?'':' plain'}" data-id="${esc(x.id)}" title="${esc(L('Головний підозрюваний: ','Prime suspect: ','Главный подозреваемый: ')+x.name)}">${hh?`<img src="${STEAM+hh.img}" alt="" onerror="this.remove()">`:''}${esc(x.id)}</button>`}).join('');
  $('chips').innerHTML=html;
  $('chips').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>run(b.dataset.id));
}

$('form').addEventListener('submit',e=>{e.preventDefault();run($('mid').value)});
$('mid').addEventListener('paste',()=>setTimeout(()=>{const id=parseId($('mid').value);if(id&&id!==$('mid').value)$('mid').value=id},0));
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(S&&graphNarrow!==null&&(($('graphBox').clientWidth||innerWidth)<600)!==graphNarrow)renderGraph()},150)});
const c0=store.get('nf_const_v4');if(c0){HEROES=c0.h;ITEMS=c0.i;indexConst()}
loadTables();
applyStatic();renderChips();
(function boot(){const h=location.hash.replace('#',''),id=parseId(h);
  if(id){setView('match',false);run(id)}
  else if(['my','stats','crew'].includes(h))setView(h,false);
  else setView(accs().me?'my':'match',false);
})();
addEventListener('hashchange',()=>{const h=location.hash.replace('#',''),id=parseId(h);
  if(id){if(V.view!=='match')setView('match',false);if(!S||String(S.m.match_id)!==id)run(id)}
  else if(['my','stats','crew'].includes(h)&&V.view!==h)setView(h,false)});
</script>
