let waitTimer=null;
const SGM={ALL_PICK:1,CAPTAINS_MODE:2,RANDOM_DRAFT:3,SINGLE_DRAFT:4,ALL_RANDOM:5,ABILITY_DRAFT:18,ALL_PICK_RANKED:22,TURBO:23};
const SLT={UNRANKED:0,PRACTICE:1,TOURNAMENT:2,RANKED:7};
const nf404=msg=>Object.assign(new Error(msg),{status:404});
const rl429=msg=>Object.assign(new Error(msg),{status:429});
function setStatusHtml(h,cls){const el=$('status');el.innerHTML=h;el.className='status'+(cls?' '+cls:'')}
const stratzNotice=()=>`<div class="notice"><p>${L('<b>Дані зі STRATZ.</b> OpenDota ще не має цього матчу, тому поки що показую базову статистику зі STRATZ. Я попросив OpenDota завантажити матч — щойно він з’явиться, сторінка сама оновиться до повного розбору.','<b>Data from STRATZ.</b> OpenDota doesn’t have this match yet, so for now this is basic STRATZ data. I asked OpenDota to fetch the match — as soon as it appears, the page will update to the full breakdown by itself.','<b>Данные из STRATZ.</b> OpenDota ещё не знает этот матч, поэтому пока показываю базовую статистику из STRATZ. Я попросил OpenDota загрузить матч — как только он появится, страница сама обновится до полного разбора.')}</p></div>`;

async function fromStratz(id){
  const q='query($id:Long!){match(id:$id){id didRadiantWin durationSeconds startDateTime gameMode lobbyType players{playerSlot isRadiant heroId kills deaths assists numLastHits numDenies goldPerMinute experiencePerMinute level networth heroDamage towerDamage heroHealing leaverStatus position item0Id item1Id item2Id item3Id item4Id item5Id neutral0Id steamAccountId steamAccount{name seasonRank}}}}';
  let r;
  try{r=await fetch('https://api.stratz.com/graphql',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+stzKey()},body:JSON.stringify({query:q,variables:{id:+id}})})}
  catch(e){throw new Error(L('Не вдалося зв’язатися з STRATZ.','Couldn’t reach STRATZ.','Не удалось связаться с STRATZ.'))}
  if(r.status===401||r.status===403)throw new Error(L('STRATZ не прийняв ключ. Перевір, що скопіював його повністю.','STRATZ rejected the key. Make sure you copied all of it.','STRATZ не принял ключ. Проверь, что скопировал его полностью.'));
  if(r.status===429)throw new Error(L('Ліміт запитів STRATZ вичерпано. Спробуй пізніше.','STRATZ rate limit reached. Try later.','Лимит запросов STRATZ исчерпан. Попробуй позже.'));
  const j=await r.json(),mm=j.data&&j.data.match;
  if(!mm){if(j.errors&&j.errors.length)throw new Error('STRATZ: '+j.errors.map(e=>e.message).join('; ').slice(0,240));throw new Error(L('STRATZ теж не знає цього матчу.','STRATZ doesn’t know this match either.','STRATZ тоже не знает этот матч.'))}
  if(!Array.isArray(mm.players)||mm.players.length<2||!mm.durationSeconds||mm.didRadiantWin==null)throw new Error(L('STRATZ ще не має результату цього матчу.','STRATZ doesn’t have this match result yet.','У STRATZ ещё нет результата этого матча.'));
  const pos=v=>{const d=String(v||'').match(/(\d)/);return d?+d[1]:undefined};
  const players=mm.players.map(p=>({player_slot:p.playerSlot,isRadiant:!!p.isRadiant,hero_id:p.heroId,kills:p.kills||0,deaths:p.deaths||0,assists:p.assists||0,last_hits:p.numLastHits||0,denies:p.numDenies||0,gold_per_min:p.goldPerMinute||0,xp_per_min:p.experiencePerMinute||0,level:p.level,net_worth:p.networth||0,hero_damage:p.heroDamage||0,tower_damage:p.towerDamage||0,hero_healing:p.heroHealing||0,
    leaver_status:!p.leaverStatus||p.leaverStatus==='NONE'?0:p.leaverStatus==='DISCONNECTED'?1:3,position_est:pos(p.position),
    item_0:p.item0Id||0,item_1:p.item1Id||0,item_2:p.item2Id||0,item_3:p.item3Id||0,item_4:p.item4Id||0,item_5:p.item5Id||0,item_neutral:p.neutral0Id||0,
    account_id:p.steamAccountId||null,personaname:p.steamAccount&&p.steamAccount.name||null,rank_tier:p.steamAccount&&p.steamAccount.seasonRank||null}));
  const sc=r=>players.filter(p=>p.isRadiant===r).reduce((a,p)=>a+p.kills,0);
  return{match_id:+id,duration:mm.durationSeconds,radiant_win:!!mm.didRadiantWin,start_time:mm.startDateTime,game_mode:SGM[mm.gameMode],lobby_type:SLT[mm.lobbyType],radiant_score:sc(true),dire_score:sc(false),players,_src:'stratz'};
}

/* просимо OpenDota завантажити матч із серверів Valve і чекаємо, поки він з'явиться */
async function waitOpenDota(id){
  clearInterval(waitTimer);
  try{await getJson(API+'/request/'+id,{method:'POST'},true)}catch(e){}
  let n=0;
  waitTimer=setInterval(async()=>{
    n++;
    try{const m=await getJson(API+'/matches/'+id,null,true);
      if(m&&Array.isArray(m.players)&&m.players.length>1&&m.duration&&m.radiant_win!=null){
        clearInterval(waitTimer);
        if((S&&String(S.m.match_id)===String(id))||parseId($('mid').value)===String(id)){await loadConst();show(m);setStatus(L('Матч з’явився на OpenDota — показую повний розбір.','The match is now on OpenDota — showing the full breakdown.','Матч появился на OpenDota — показываю полный разбор.'));try{history.replaceState(null,'','#'+id)}catch(e){}}
        return}}catch(e){}
    if(n>=24){clearInterval(waitTimer);if(!S||String(S.m.match_id)!==String(id))setStatus(L('OpenDota так і не отримав цей матч за 6 хвилин. Перевір ID або спробуй пізніше.','OpenDota still hasn’t got this match after 6 minutes. Check the ID or try later.','OpenDota так и не получил этот матч за 6 минут. Проверь ID или попробуй позже.'),'err')}
  },15000);
}

  <div class="fb-links">${L('Подивитися зараз:','View now:','Посмотреть сейчас:')} <a href="https://www.dotabuff.com/matches/${id}" target="_blank" rel="noopener">Dotabuff</a> · <a href="https://stratz.com/matches/${id}" target="_blank" rel="noopener">STRATZ</a></div>`;

async function fallback(id){
  waitOpenDota(id);
  let msg='';
  if(stzKey()){
    setStatus(L(`OpenDota ще не має матчу ${id} — беру дані зі STRATZ…`,`OpenDota doesn’t have match ${id} yet — getting it from STRATZ…`,`У OpenDota ещё нет матча ${id} — беру данные из STRATZ…`),'load');

async function run(raw){
  const id=parseId(raw);
  if(!id){setStatus(L(`Не бачу ID матчу. Встав число на зразок ${EXAMPLE} або посилання на матч.`,`I can’t see a match ID. Paste a number like ${EXAMPLE} or a match link.`,`Не вижу ID матча. Вставь число вроде ${EXAMPLE} или ссылку на матч.`),'err');return}

  try{
    const [m]=await Promise.all([getJson(API+'/matches/'+id),loadConst()]);
    if(!m||!Array.isArray(m.players)||m.players.length<2)throw new Error(L('OpenDota повернув матч без гравців. Спробуй інший ID.','OpenDota returned a match with no players. Try another ID.','OpenDota вернул матч без игроков. Попробуй другой ID.'));
    if(!m.duration||m.radiant_win==null||m.players.every(p=>!p.hero_id))throw new Error(L('Цей матч ще йде або OpenDota ще не отримав його результат. Спробуй через кілька хвилин після кінця гри.','This match is still in progress or OpenDota doesn’t have the result yet. Try a few minutes after the game ends.','Этот матч ещё идёт или OpenDota ещё не получил его результат. Попробуй через несколько минут после конца игры.'));
    show(m);setStatus('');
    try{history.replaceState(null,'','#'+id)}catch(e){}
    $('result').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  }catch(e){if(e.status===404){fallback(id);return}console.error(e);setStatus(e.message,'err')}
  finally{$('go').disabled=false}
}

function saveHistory(){
  const c=S.culprit,h=(store.get('nf_hist')||[]).filter(x=>x.id!==String(S.m.match_id));
  h.unshift({id:String(S.m.match_id),hero:c.hero_id,name:pname(c)});
  store.set('nf_hist',h.slice(0,8));renderChips();
}
function renderChips(){
  const h=store.get('nf_hist')||[];
  let html;
  if(!h.length)html=`<span class="lbl">${L('Приклад:','Example:','Пример:')}</span><button type="button" class="chip plain" data-id="${EXAMPLE}">${EXAMPLE}</button>`;
  else html=`<span class="lbl">${L('Нещодавні:','Recent:','Недавние:')}</span>`+h.map(x=>{const hh=HEROES&&HEROES[x.hero];return `<button type="button" class="chip${hh?'':' plain'}" data-id="${esc(x.id)}" title="${esc(L('Головний підозрюваний: ','Prime suspect: ','Главный подозреваемый: ')+x.name)}">${hh?`<img src="${STEAM+hh.img}" alt="" onerror="this.remove()">`:''}${esc(x.id)}</button>`}).join('');
  $('chips').innerHTML=html;
  $('chips').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>run(b.dataset.id));
}

$('form').addEventListener('submit',e=>{e.preventDefault();run($('mid').value)});
$('mid').addEventListener('paste',()=>setTimeout(()=>{const id=parseId($('mid').value);if(id&&id!==$('mid').value)$('mid').value=id},0));
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(S&&graphNarrow!==null&&(($('graphBox').clientWidth||innerWidth)<600)!==graphNarrow)renderGraph()},150)});
const c0=store.get('nf_const_v3');if(c0){HEROES=c0.h;ITEMS=c0.i}
applyStatic();renderChips();
const hashId=parseId(location.hash);if(hashId)run(hashId);
addEventListener('hashchange',()=>{const id=parseId(location.hash);if(id&&(!S||String(S.m.match_id)!==id))run(id)});
</script>
</body>
